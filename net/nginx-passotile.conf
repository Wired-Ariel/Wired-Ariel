# =============================================================================
# nginx-passotile.conf - gen3-poke-multiplayer dentro un vhost HTTPS gia' esistente
# =============================================================================
#
# Va copiato sul server in /etc/nginx/passotile-locations.conf e incluso da un
# vhost che ha GIA' un certificato valido, con UNA riga:
#
#     include /etc/nginx/passotile-locations.conf;
#
# Tutta la configurazione di gen3-poke-multiplayer sta qui: si toglie togliendo quella riga.
#
#   /passotile/     -> il pannello web (statico, /var/www/passotile)
#   /passotile/ws   -> il relay via WebSocket -> relay_ws.py su 127.0.0.1:9001
#                      (che parla UDP con relay.py su 9000)
#
# I browser non fanno UDP: e' questo il pezzo che li porta sullo STESSO relay a
# cui parlano gli emulatori e i GBA con client.py, quindi tutti finiscono nelle
# stesse stanze.

# --- il relay (WebSocket) ----------------------------------------------------
location = /passotile/ws {
    proxy_pass http://127.0.0.1:9001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SENZA QUESTO IL GIOCO SCATTA. Il buffering di nginx accumula i messaggi
    # prima di inoltrarli: su un canale dove ogni passo e' 12 byte e conta il
    # millisecondo, sarebbe ritardo aggiunto gratis.
    proxy_buffering off;
    tcp_nodelay on;

    # Al massimo 8 connessioni al relay per indirizzo IP: nessuno puo' intasarlo per
    # gli altri. Serve la zona, dichiarata UNA volta nel blocco http (per esempio in
    # /etc/nginx/conf.d/g3pm-limiti.conf):
    #     limit_conn_zone $binary_remote_addr zone=g3pm_ws:10m;
    limit_conn g3pm_ws 8;
    limit_conn_status 429;

    # Una partita dura ore e il traffico si ferma davvero (menu, lotta, casa):
    # con i timeout di default nginx chiuderebbe la connessione a meta' partita.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- il pannello (statico) ---------------------------------------------------
location /passotile/ {
    alias /var/www/passotile/;
    index index.html;
    try_files $uri $uri/ =404;
}

# config.js porta relay e stanza: se il browser lo tenesse in cache, un cambio
# di indirizzo non arriverebbe mai a chi ha gia' aperto la pagina una volta.
location = /passotile/config.js {
    alias /var/www/passotile/config.js;
    add_header Cache-Control "no-store";
}

# mbstub.gba e' il programma che il browser carica nel GBA via multiboot: si
# scarica come binario, e non deve restare in cache fra due versioni (la
# trappola dello stub vecchio, 2026-08-22).
location = /passotile/mbstub.gba {
    alias /var/www/passotile/mbstub.gba;
    default_type application/octet-stream;
    add_header Cache-Control "no-store";
}
