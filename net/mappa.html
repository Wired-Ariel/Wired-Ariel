  // ------------------------------------------------ il calcolatore di Feebas
  //
  // L'algoritmo e' quello VERO del gioco (src/wild_encounter.c:113-179):
  //   seme = gSaveBlock1Ptr->dewfordTrends[0].rand  (u16, SaveBlock1+0x2E66)
  //   per 6 volte: s = s*1103515245+12345 (u32); v = (s>>16) % 447;
  //                se v==0 -> 447; se v<4 si ritira (i primi 3 spot sono
  //                irraggiungibili in cima alla mappa)
  // Gli spot validi sono 4..447 e i candidati in dati.json sono GIA'
  // nell'ordine del gioco (riga per riga, saltando i primi 3): il tile dello
  // spot N e' feebas[N-4]. Controprova nel sorgente: il primo spot valido e'
  // il 4 a (18,18), che e' esattamente feebas[0].
  function feebasSpotDaSeme(seme) {
    var s = seme >>> 0, out = [], estratte = 0;
    while (estratte < 6) {
      s = (Math.imul(s, 1103515245) + 12345) >>> 0;
      var v = (s >>> 16) % 447;
      if (v === 0) v = 447;
      if (v < 4) continue;      // come il gioco: i primi 3 spot si ritirano
      out.push(v); estratte++;  // i doppioni CONTANO (il gioco li tiene)
    }
    // tolti solo per il disegno: un doppione e' lo stesso tile due volte
    return out.filter(function (v, i) { return out.indexOf(v) === i; });
  }

  // Il seme dal .sav: si rimontano i settori come fa tools/analizza_save.py
  // (14 settori da 4096 byte per fessura, footer a +4084: id, checksum,
  // firma 0x08012025, contatore). SaveBlock1 sta nei settori id 1..4;
  // dewfordTrends[0] sta a SaveBlock1+0x2E68 (vedi sotto: il commento
  // della decomp e' sfasato di 4 byte, e qui si controlla che i gruppi delle
  // due parole siano quelli giusti prima di fidarsi del numero).
  function feebasSemeDaSav(buf) {
    var u8 = new Uint8Array(buf);
    if (u8.length < 57344) return null;
    var dv = new DataView(buf);
    function leggiFessura(base) {
      var settori = {}, contatore = 0, ok = false;
      for (var i = 0; i < 14; i++) {
        var off = base + i * 4096;
        if (off + 4096 > u8.length) return null;
        var firma = dv.getUint32(off + 4084 + 4, true);
        if (firma !== 0x08012025) continue;
        var id = dv.getUint16(off + 4084, true);
        settori[id] = off;
        contatore = Math.max(contatore, dv.getUint32(off + 4084 + 8, true));
        ok = true;
      }
      return ok ? { settori: settori, contatore: contatore } : null;
    }
    var a = leggiFessura(0), b = u8.length >= 114688 ? leggiFessura(57344) : null;
    var f = (a && b) ? (a.contatore >= b.contatore ? a : b) : (a || b);
    if (!f) return null;
    // SaveBlock1+0x2E66: 0x2E66 = 2*3968 + 3942 -> settore id 3, offset 3942
    // L'INDIRIZZO GIUSTO E' 0x2E68, NON quello del commento della decomp.
    // global.h scrive /*0x2e64*/ davanti a dewfordTrends, ma quel commento e'
    // sfasato di 4 byte: con 0x2E64 le due parole della frase cadono nei
    // gruppi 54 e 113, che NON ESISTONO (i gruppi sono ~24). Con 0x2E68
    // cadono in CONDITIONS (10) e LIFESTYLE (12), che sono esattamente quelli
    // che InitDewfordTrend sorteggia - e 0x2E68 + 5 voci x 8 byte = 0x2E90,
    // cioe' l'inizio di contestWinners. Verificato sul salvataggio di Lain.
    var TRENDS = 0x2E68, RAND = TRENDS + 2;
    var pezzo = Math.floor(RAND / 3968), resto = RAND % 3968;
    var so = f.settori[1 + pezzo];
    if (so === undefined) return null;
    // CONTROLLO, non fiducia: le due parole della frase devono stare nei
    // gruppi che il gioco usa (CONDITIONS 10, poi LIFESTYLE 12 o HOBBIES 13).
    // Se non e' cosi', quello che stiamo leggendo non e' una frase di
    // tendenza e il numero non va usato.
    var pezzoW = Math.floor((TRENDS + 4) / 3968), restoW = (TRENDS + 4) % 3968;
    var soW = f.settori[1 + pezzoW];
    if (soW === undefined) return null;
    var w0 = dv.getUint16(soW + restoW, true);
    var w1 = dv.getUint16(soW + restoW + 2, true);
    var g0 = w0 >> 9, g1 = w1 >> 9;
    if (g0 !== 10 || (g1 !== 12 && g1 !== 13)) return null;
    return dv.getUint16(so + resto, true);
  }

  // I SEMI COMPATIBILI con i tile dove Feebas e' GIA' uscito.
  //
  // Serve a chi gioca su GBA vero e non ha il salvataggio sottomano: il seme
  // non si legge, ma si DEDUCE. Sono solo 65536 semi e sei estrazioni
  // ciascuno: si provano tutti in un lampo. Misurato (Percorso 119): 1 tile
  // noto -> 883 semi, 2 -> 6, 3 -> UNO SOLO, ed e' quello giusto (provato
  // contro il salvataggio di Lain, seme 57936).
  // I SEI SPOT CHE NON SI POSSONO PESCARE. Il gioco li sorteggia lo stesso,
  // ma da riva non ci si arriva: se uno dei tuoi sei cade qui, quel posto e'
  // perso e i tile utili diventano cinque. La lista viene dal calcolatore di
  // mucksw (Feebas-Tile-Calculator), unico punto in cui questa pagina si
  // appoggia a un lavoro altrui invece che alla decomp o alla cartuccia.
  var FEEBAS_IRRAGGIUNGIBILI = [105, 119, 144, 296, 297, 298];

  // IL METODO DELLA FRASE DI TENDENZA (algoritmo di mucksw, riletto nel loro
  // sorgente e riprovato qui). Non ricostruisce la partita: parte da un
  // ancoraggio (per Smeraldo il numero dell'ID Allenatore), salta i primi 700
  // giri e poi CERCA nel flusso il punto in cui il generatore produce proprio
  // le due parole della tua frase; il valore 6, 7 o 8 giri dopo e' il seme di
  // Feebas. Escono piu' candidati perche' il numero di giri dipende da quanto
  // e' durata la schermata in cui la frase e' stata creata.
  //
  // PROVATO sul salvataggio di Lain: frase (SEI AL TOP, NOTIZIE) e ID 8508
  // danno cinque candidati e il secondo, 57936, e' esattamente il seme che si
  // legge nel salvataggio.
  function feebasAvanza(s, n) {
    for (var i = 0; i < n; i++) s = (Math.imul(s, 1103515245) + 24691) >>> 0;
    return s;
  }
  function feebasSemiDaFrase(idxCond, gruppoLifestyle, idxSecondo, tid, quanti) {
    var s = feebasAvanza(tid >>> 0, 700);
    var el = gruppoLifestyle ? 45 : 54;
    var out = [], giri = 0;
    while (out.length < (quanti || 5) && giri < 4000000) {
      s = feebasAvanza(s, 1); giri++;
      if ((s >>> 16) % 69 !== idxCond) continue;
      if (((feebasAvanza(s, 1) >>> 16) & 1) !== gruppoLifestyle) continue;
      if ((feebasAvanza(s, 2) >>> 16) % el !== idxSecondo) continue;
      var n;
      if ((feebasAvanza(s, 4) >>> 16) % 98 > 50) n = ((feebasAvanza(s, 5) >>> 16) % 98 > 80) ? 8 : 7;
      else n = 6;
      out.push(feebasAvanza(s, n) >>> 16);
    }
    return out;
  }

  function feebasSemiDaTile(key, noti) {
    var m = dati.mappe[key];
    if (!m || !m.feebas || !noti.length) return [];
    var idx = {};                       // "x,y" -> numero dello spot (indice+4)
    for (var i = 0; i < m.feebas.length; i++) idx[m.feebas[i][0] + "," + m.feebas[i][1]] = i + 4;
    var cerco = [];
    for (var j = 0; j < noti.length; j++) {
      var s = idx[noti[j][0] + "," + noti[j][1]];
      if (s === undefined) return null;  // tile che non e' nemmeno candidato
      cerco.push(s);
    }
    var out = [];
    for (var seme = 0; seme < 65536; seme++) {
      var spot = feebasSpotDaSeme(seme), ok = true;
      for (var q = 0; q < cerco.length; q++) {
        if (spot.indexOf(cerco[q]) < 0) { ok = false; break; }
      }
      if (ok) out.push(seme);
    }
    return out;
  }

  function applicaFeebasSeme(key, seme) {
    var m = dati.mappe[key];
    if (!m || !m.feebas || !m.feebas.length) return [];
    feebasSeme = seme & 0xFFFF;
    var spot = feebasSpotDaSeme(feebasSeme);
    // via gli spot irraggiungibili: mandare qualcuno a pescare dove non si
    // puo' arrivare e' peggio che non dirglielo
    feebas6[key] = spot.filter(function (n) { return FEEBAS_IRRAGGIUNGIBILI.indexOf(n) < 0; })
                       .map(function (n) { return m.feebas[n - 4]; })
                       .filter(function (v) { return !!v; });
    try { localStorage.setItem("passotile-feebas-seme", String(feebasSeme)); } catch (e) {}
    dirty = true;
    return feebas6[key];
  }

      // --- terzo metodo: i tile gia' pescati ---------------------------

          if (compat.length === 1) {

            fes3.innerHTML = t("calcFraseUno", compat[0]) + "<br>"

            return;

        Array.prototype.forEach.call(fes3.querySelectorAll("[data-seme]"), function (el) {

  // ------------------------------------------------- animazione dei giocatori
  //
  // `anim[peer]` ricorda da dove veniva e quando e' partito: il disegno
  // interpola fra le due posizioni invece di teletrasportare, e mentre
  // scivola alterna i fotogrammi del passo. Se il salto e' lungo (warp,
  // cambio mappa, primo avvistamento) NON si anima: si compare e basta,
  // perche' una scivolata di venti tile sarebbe una bugia.
  //
  // UN SALTO BREVE E' UNA CATENA DI PASSI, NON UNA SCIVOLATA (2026-08-26).
  // Qui arrivano POSIZIONI, non passi: se fra due campioni il giocatore ha
  // percorso 2 o 3 tile (succede correndo e in bici, dove i passi durano
  // ~133 e ~67 ms contro i 260 di un campione), la versione di prima li
  // copriva in UN'unica scivolata da 260 ms - cioe' a velocita' doppia o
  // tripla, con un solo movimento del piede. Si legge come "scivola" o
  // "salta come una pedina", ed e' il difetto che Lain ha rivisto.
  //
  // Adesso la durata e' PROPORZIONALE ai tile (PASSO_MS ciascuno) e il piede
  // cambia a ogni tile: due tile = due passi veri, uno dopo l'altro. Con un
  // tetto pero': se il ritardo si accumulasse (campioni piu' fitti
  // dell'animazione), si accorcia il passo fino a RECUPERO_MIN_MS - e' la
  // stessa marcia di recupero che il payload fa sul GBA, per la stessa
  // ragione: meglio camminare un po' piu' svelti che restare indietro.
  var anim = {};
  var PASSO_MS = 260;          // quanto dura UN tile
  // 6 tile: in un campione (~260 ms) nemmeno la bici ne fa di piu' (un tile
  // ogni 4 frame, ~66 ms), quindi sopra questa soglia non e' una camminata ma
  // un warp. Era 3, e tagliava fuori proprio la BICI: 4 tile per campione non
  // venivano animati affatto - l'avatar spariva e ricompariva piu' in la',
  // che e' l'altra meta' del difetto (2026-08-26).
  var PASSO_MAX = 6;           // oltre questo non e' una camminata: e' un salto
  // 60 ms: e' il tile della BICI nel gioco vero (4 frame). Un pavimento
  // piu' alto sembrava prudente e invece era il difetto: con 90 ms un
  // campione da 4 tile durava 360 ms contro i ~266 con cui arrivano, e
  // l'avatar accumulava ritardo fino a otto tile (misurato) - cioe' si
  // muoveva sempre, ma nel posto sbagliato.
  var RECUPERO_MIN_MS = 60;    // il passo piu' corto che si concede al recupero

  function aggiornaAnim(g) {
    var a = anim[g.peer];
    if (!a) { anim[g.peer] = { x: g.x, y: g.y, dax: g.x, day: g.y, t0: 0, passo: 0, durata: PASSO_MS, tile: 1 }; return; }
    if (a.x === g.x && a.y === g.y) return;
    var d = Math.abs(g.x - a.x) + Math.abs(g.y - a.y);
    var ora = (typeof performance !== "undefined" ? performance.now() : Date.now());
    // da dove parte la scivolata: dove il disegno lo sta mostrando ADESSO,
    // non dove stava prima - se arrivano due passi ravvicinati non si torna
    // indietro di scatto.
    var cur = posAnim(g.peer, a);
    var animabile = (d <= PASSO_MAX);
    a.dax = animabile ? cur.x : g.x;
    a.day = animabile ? cur.y : g.y;
    a.x = g.x; a.y = g.y;
    a.t0 = animabile ? ora : 0;
    // quanti tile restano DAVVERO da coprire (dal punto in cui siamo ora):
    // se il campione precedente non era ancora finito, il residuo entra qui.
    var restanti = Math.max(1, Math.round(Math.abs(a.x - a.dax) + Math.abs(a.y - a.day)));
    a.tile = restanti;
    // QUANTO DEVE DURARE, e perche' non e' semplicemente 260 ms per tile.
    //
    // L'animazione ha una scadenza: il PROSSIMO campione. Se dura di piu', la
    // si vede sempre interrotta a meta' e il disegno resta indietro di un
    // pezzo in piu' a ogni giro - correndo (2 tile ogni ~266 ms) l'avatar
    // accumulava ritardo invece di correre, ed era una delle due meta' del
    // difetto (2026-08-26). Quindi: al massimo PASSO_MS per tile, ma non
    // oltre l'intervallo con cui i campioni stanno arrivando davvero - che e'
    // poi la velocita' vera di chi cammina. Sotto, un pavimento, per non
    // trasformare un salto corto in un lampo.
    var periodo = a.tUltimoCampione ? (ora - a.tUltimoCampione) : restanti * PASSO_MS;
    a.tUltimoCampione = ora;
    a.durata = Math.max(restanti * RECUPERO_MIN_MS,
                        Math.min(restanti * PASSO_MS, periodo));
    // il piede si alterna a ogni PASSO, come nel gioco
    a.passo = (a.passo || 0) + 1;
    // la direzione del passo, dal delta: e' quella da mostrare mentre scivola
    var dx = g.x - a.dax, dy = g.y - a.day;
    if (Math.abs(dx) >= Math.abs(dy)) a.dirPasso = dx > 0 ? "dx" : (dx < 0 ? "sx" : a.dirPasso);
    else a.dirPasso = dy > 0 ? "giu" : "su";
  }

  // Dove disegnare il giocatore in questo istante, e se sta camminando.
  function posAnim(peer, a) {
    a = a || anim[peer];
    if (!a) return { x: 0, y: 0, cammina: false, f: 0 };
    if (!a.t0) return { x: a.x, y: a.y, cammina: false, f: 0 };
    var ora = (typeof performance !== "undefined" ? performance.now() : Date.now());
    var k = (ora - a.t0) / (a.durata || PASSO_MS);
    if (k >= 1) { a.t0 = 0; a.dax = a.x; a.day = a.y; return { x: a.x, y: a.y, cammina: false, f: 0 }; }
    // A che punto siamo DENTRO il tile corrente: con piu' tile da coprire,
    // ognuno ha il suo ciclo di passo (e il suo piede), invece di un unico
    // movimento lungo tutta la scivolata.
    var tile = a.tile || 1;
    var dentro = (k * tile) % 1;
    var indice = Math.floor(k * tile);
    return {
      x: a.dax + (a.x - a.dax) * k,
      y: a.day + (a.y - a.day) * k,
      cammina: true,
      dir: a.dirPasso,
      // UN fotogramma di passo per tile, col piede che si alterna per
      // parita' del passo (come il gioco): A,fermo,B,fermo... - alternare
      // A e B DENTRO lo stesso passo faceva tremare la gamba
      f: dentro < 0.72 ? ((((a.passo || 0) + indice) % 2) ? 1 : 2) : 0
    };
  }

  // Finche' qualcuno cammina il disegno non puo' fermarsi: `dirty` da solo
  // basta per gli eventi, non per un'animazione che va avanti da se'.
  function qualcunoCammina() {
    for (var i = 0; i < giocatori.length; i++) {
      var a = anim[giocatori[i].peer];
      if (a && a.t0) return true;
    }
    return false;
  }

  // ---------------------------------------------------------------- posizioni
  //
  // DUE SORGENTI, UN SOLO FORMATO (2026-08-24). Nel pannello PYTHON le
  // posizioni arrivano da `api/posizioni`, cioe' dai file posizioni-<peer>.json
  // che client.py scrive su disco. Nel pannello WEB non c'e' nessun server che
  // le scriva: le manda la scheda del pannello via BroadcastChannel, con lo
  // STESSO payload {t, viste:[...]}. Da `applica()` in giu' non cambia niente:
  // e' il motivo per cui il formato si tiene identico invece di inventarne uno
  // nuovo per il web.
  function applica(d) {
    var perPeer = {};
    var adessoS = (d.t || Date.now() / 1000);
    (d.viste || []).forEach(function (v) {
      if (adessoS - (v.t || 0) > 15) return;
      if (v.io) { var io2 = Object.assign({}, v.io, { peer: v.peer, io: true }); if (!perPeer[v.peer] || io2.t >= perPeer[v.peer].t) perPeer[v.peer] = io2; }
      Object.keys(v.amici || {}).forEach(function (p) {
        var a = Object.assign({}, v.amici[p], { peer: +p, io: false });
        if (!perPeer[p] || (!perPeer[p].io && a.t > perPeer[p].t)) perPeer[p] = a;
      });
    });
    giocatori = Object.keys(perPeer).map(function (p) {
      var g = perPeer[p]; g.label = g.io ? t("tu", p) : t("amico", p); return g;
    });
    giocatori.sort(function (a, b) { return a.peer - b.peer; });
    giocatori.forEach(aggiornaAnim);
    aggiornaGiocatori();
    seguiAdesso();
    dirty = true;
  }

  // Il pannello web, se e' aperto in un'altra scheda dello stesso sito.
  var daWeb = null, daWebT = 0, canalePos = null;
  try {
    canalePos = new BroadcastChannel("passotile-posizioni");
    canalePos.onmessage = function (ev) {
      if (!ev.data || ev.data.chiedo) return;
      daWeb = ev.data; daWebT = Date.now();
      // SI APPLICA SUBITO, senza aspettare il timer del poll: i timer delle
      // schede in background il browser li rallenta fino a uno al minuto,
      // ma onmessage arriva sempre - era meta' del "movimento che si
      // blocca" sul sito (l'altra meta' stava nel pannello, che pubblicava
      // da un setInterval: ora pubblica a ogni evento di rete).
      if (dati) applica(daWeb);
    };
    // Chi apre la mappa DOPO il pannello non deve aspettare il prossimo
    // battito: si chiede, e il pannello risponde subito.
    canalePos.postMessage({ chiedo: true });
  } catch (e) { /* browser senza BroadcastChannel: resta il fetch */ }

  // Al ritorno in primo piano si riparte subito, qualunque sia la sorgente.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      if (canalePos) { try { canalePos.postMessage({ chiedo: true }); } catch (e) {} }
      poll();
      dirty = true;
    }
  });

  // Sul SITO STATICO `api/posizioni` non esiste e non comparira' mai: senza
  // questo contatore il poll a 500 ms sparava due 404 al secondo per sempre
  // (misurati 160 in pochi secondi al primo collaudo). Tre tentativi e si
  // smette: da li' in poi la sorgente e' solo il pannello web.
  var apiFallita = 0;
  function poll() {
    // Il pannello web ha la precedenza quando sta parlando.
    if (daWeb && Date.now() - daWebT < 10000) { applica(daWeb); return; }
    if (apiFallita >= 3) return;
    fetch("api/posizioni", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        apiFallita = 0;
        return r.json();
      })
      .then(applica)
      .catch(function () {
        if (++apiFallita === 3) {
          console.log("[mappa] api/posizioni non c'e' (sito statico): le posizioni " +
                      "le aspetto dal pannello web, nella scheda accanto.");
        }
      });
  }

  function aggiornaGiocatori() {
    var box = $("giocatori"), sel = $("sel-segui"), val = sel.value;
    if (!giocatori.length) { box.innerHTML = "<span class='vuoto'>" + t("nessunG") + "</span>"; return; }
    var STATO_NOMI = { 0: "", 1: "in lotta", 2: "in un dialogo", 3: "nel menu", 4: "nella Borsa", 5: "nella Squadra", 6: "nel Pokédex", 7: "nel PokéNav" };
    var STATO_EN = { 0: "", 1: "in battle", 2: "in a dialog", 3: "in the menu", 4: "in the Bag", 5: "in the Party", 6: "in the Pokédex", 7: "in the PokéNav" };
    var h = "";
    giocatori.forEach(function (g) {
      var eta = Math.round(Date.now() / 1000 - g.t);
      var st = (lang === "it" ? STATO_NOMI : STATO_EN)[g.stato] || "";
      h += "<div class=giocatore><span class=pallino style='background:" + (g.io ? "#7fb2ff" : "#16a06e") + "'></span><span><b>"
        + g.label + "</b> · " + nomeMappaK(chiaveDi(g.gruppo, g.numero)) + " (" + (g.x - MAP_OFFSET) + "," + (g.y - MAP_OFFSET) + ")"
        + (st ? " · " + st : "") + " <span class=muto>" + (eta > 15 ? t("fermo", eta) : t("dalVivo")) + "</span></span></div>";
    });
    box.innerHTML = h;
    var opts = "<option value=''>—</option>";
    giocatori.forEach(function (g) { opts += "<option value='" + g.peer + "'>" + g.label + "</option>"; });
    if (sel.innerHTML !== opts) { sel.innerHTML = opts; sel.value = val; }
  }

  function seguiAdesso() {
    if (!segui) return;
    var g = null;
    for (var i = 0; i < giocatori.length; i++) if (String(giocatori[i].peer) === String(segui)) g = giocatori[i];
    if (!g) return;
    var k = chiaveDi(g.gruppo, g.numero), m = dati.mappe[k];
    if (!m) return;
    if (!origine(k)) impostaVista(m.mondo ? { tipo: "mondo", id: m.mondo } : { tipo: "mappa", key: k }, false);
    var o = origine(k);
    cx = (o.x + g.x - MAP_OFFSET + 0.5) * T; cy = (o.y + g.y - MAP_OFFSET + 0.5) * T;
    if (z < 1.5) z = 2;
    dirty = true;
  }

  // ------------------------------------------------- il foglio su telefono
  //
  // Su schermo stretto il pannello laterale diventa un foglio che sale dal
  // basso. Si apre e si chiude in tre modi, perche' sul telefono il gesto
  // giusto non e' mai lo stesso per tutti: toccando la maniglia,
  // trascinandola, e da solo quando si tocca qualcosa sulla mappa (li' il
  // dettaglio serve subito, ed e' il momento in cui l'utente lo vuole).
  var lato = $("lato"), maniglia = $("maniglia");
  function foglioMobile() {
    return maniglia && getComputedStyle(maniglia).display !== "none";
  }
  function apriFoglio(v) {
    if (!foglioMobile()) return;
    lato.classList.toggle("su", v !== false);
    var e = $("t-maniglia");
    if (e) e.textContent = lato.classList.contains("su")
      ? (lang === "it" ? "chiudi" : "close")
      : (lang === "it" ? "Dettagli" : "Details");
  }
  if (maniglia) {
    var tocco = null;
    maniglia.addEventListener("click", function () { apriFoglio(!lato.classList.contains("su")); });
    maniglia.addEventListener("touchstart", function (e) {
      tocco = { y: e.touches[0].clientY, aperto: lato.classList.contains("su"), mosso: false };
      lato.style.transition = "none";
    }, { passive: true });
    maniglia.addEventListener("touchmove", function (e) {
      if (!tocco) return;
      var dy = e.touches[0].clientY - tocco.y;
      if (Math.abs(dy) > 6) tocco.mosso = true;
      var base = tocco.aperto ? 0 : lato.offsetHeight - 46;
      var y = Math.max(0, Math.min(lato.offsetHeight - 46, base + dy));
      lato.style.transform = "translateY(" + y + "px)";
    }, { passive: true });
    maniglia.addEventListener("touchend", function () {
      if (!tocco) return;
      lato.style.transition = "";
      lato.style.transform = "";
      if (tocco.mosso) {
        // dove si e' fermato il dito decide: sopra la meta' resta aperto
        var m = lato.getBoundingClientRect().top;
        apriFoglio(m < window.innerHeight - lato.offsetHeight / 2);
      } else {
        apriFoglio(!tocco.aperto);
      }
      tocco = null;
    });
  }
  // Toccando la mappa il dettaglio si apre da solo: e' l'unico momento in cui
  // si sa con certezza che l'utente lo vuole vedere.
  if (tela) tela.addEventListener("click", function () {
    if (foglioMobile()) setTimeout(function () { apriFoglio(true); }, 30);
  });

  ridimensiona();
  requestAnimationFrame(disegna);
  carica();

  window.__mappa = {
    ridisegna: function () { dirty = true; disegna(); },
    lingua: function (l) { lang = l; applicaLingua(); },
    stato: function () {
      function conta(cache) {
        var caricate = 0, rotte = 0, tot = 0;
        Object.keys(cache).forEach(function (k) { tot++; if (cache[k].rotta) rotte++; else if (cache[k].complete && cache[k].naturalWidth) caricate++; });
        return { tot: tot, caricate: caricate, rotte: rotte };
      }
      // lo stato dell'animazione: serve a provarla senza guardare lo schermo
      var camm = giocatori.map(function (g) {
        var pa = posAnim(g.peer);
        return { peer: g.peer, x: Math.round(pa.x * 100) / 100, y: Math.round(pa.y * 100) / 100,
                 cammina: pa.cammina, frame: pa.f };
      });
      return { vista: vista, z: z, cx: cx, cy: cy, lang: lang, giocatori: giocatori.length, camm: camm,
               immagini: conta(immagini), sprite: conta(sprite), oe: conta(oeImg), item: conta(itemImg),
               mappe: dati ? Object.keys(dati.mappe).length : 0, porte: porteVisibili().length };
    },
    vai: function (key) { selezionata = key; centraSu(key, undefined, undefined, 2); mostraMappa(key); aggiornaNav(); dirty = true; disegna(); },
    // apre la schedina di un personaggio senza doverlo cliccare: serve alle
    // prove automatiche (la schedina e' quella che si vede sulla mappa)
    persona: function (key, i, px, py) {
      var m = dati.mappe[key];
      if (!m || !m.personaggi[i]) return null;
      apriSchedaPersonaggio(m.personaggi[i], key, px || 60, py || 60);
      mostraPersonaggio(m.personaggi[i], key);
      return m.personaggi[i].nome;
    },
    indietro: indietro
  };
})();
</script>
