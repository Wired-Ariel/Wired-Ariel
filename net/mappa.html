<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gen3-poke-multiplayer — Mappa live</title>
<link rel="icon" href="img/favicon.png">
<!--
  La mappa live del pannello (pannello.py la serve su 127.0.0.1).

  Stessa regola di pannello.html: NIENTE RISORSE ESTERNE. Font di sistema,
  immagini da net/img/ e da net/mappa/ (generate da tools/gen_mappa.py).

  Resa grafica: design del 2026-08-22, adattato. Rispetto a quello, qui ci
  sono in piu':
    - LE PORTE: ogni warp e' un'icona cliccabile che apre l'interno, e dentro
      l'icona verde riporta fuori. Se le porte in un punto sono piu' d'una, il
      clic apre un elenco invece di scegliere per te.
    - le icone VERE degli strumenti (graphics/items/icons della decomp), MT
      comprese, con la palette per tipo che usa il gioco;
    - la scheda dell'allenatore: il suo sprite del campo, e la squadra con lo
      sprite anteriore ANIMATO (anim_front.png e' 64x128, cioe' due
      fotogrammi: e' l'animazione vera del gioco) e il livello;
    - italiano/inglese con i nomi UFFICIALI letti dalla cartuccia italiana
      (tools/nomi_it.py). Niente traduzioni inventate: dove la ROM non ha una
      stringa - i nomi delle stanze interne, per esempio - resta l'inglese.
-->
<style>
  :root {
    --verde-cupo: #0f3428;
    --verde: #0f6b4a;
    --verde-vivo: #16a06e;
    --verde-chiaro: #3fd68f;
    --carta: #f2ede1;
    --scheda: #fffdf7;
    --bordo: #dfd7c4;
    --bordo-scuro: #cbc3b0;
    --inchiostro: #16211c;
    --tenue: #6b7269;
    --tenue2: #8b9189;
    --ambra: #c07a12;
    --rosso: #b3392f;
    --azzurro: #2f6bc0;
    --viola: #7a58c0;
    --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--inchiostro); background: var(--carta);
  }
  img.px, img.ic, img.spr, img.itm { image-rendering: pixelated; }

  /* ---------------------------------------------------------- testa */
  header {
    position: relative; overflow: hidden; flex: none;
    background: var(--verde-cupo); color: #eaf5ee; padding: 13px 0 14px;
  }
  header .erba, header .velo { position: absolute; inset: 0; }
  header .erba {
    background: url(img/tile-erba-alta.png) 0 0/96px 96px repeat;
    image-rendering: pixelated; opacity: .9;
  }
  header .velo {
    background: linear-gradient(100deg, rgba(8,26,20,.92) 0%, rgba(8,26,20,.78) 55%, rgba(8,26,20,.52) 100%);
  }
  header .dentro {
    position: relative; padding: 0 20px;
    display: flex; align-items: center; gap: 15px;
  }
  .marchio {
    position: relative; width: 44px; height: 44px; flex: none;
    border-radius: 11px; overflow: hidden; border: 2px solid #08211a;
    box-shadow: 0 6px 16px rgba(0,0,0,.35);
  }
  .marchio .fondo {
    position: absolute; inset: 0;
    background: url(img/tile-erba-alta.png) 0 0/24px 24px repeat;
    image-rendering: pixelated;
  }
  .marchio .o1 { position: absolute; left: 4px; bottom: 4px; width: 20px; height: 20px; }
  .marchio .o2 { position: absolute; right: 3px; top: 3px; width: 17px; height: 17px; }
  header h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
  header .sub { margin: 2px 0 0; font-size: 12.5px; color: rgba(234,245,238,.74); }
  .targhe { margin-left: auto; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .targa {
    display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px;
    border-radius: 9px; background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.16);
    font: 12px/1 var(--mono); color: #bfe2cd; white-space: nowrap;
  }
  .targa b { font-weight: 700; color: #eaf5ee; }
  .targa .led { width: 7px; height: 7px; border-radius: 50%; background: var(--verde-chiaro); }
  a.torna {
    display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px;
    border-radius: 9px; background: rgba(255,255,255,.94); border: 1px solid #0a2a20;
    color: #10382a; font-size: 12.5px; font-weight: 700; text-decoration: none;
  }
  a.torna:hover { background: #fff; }

  /* interruttore lingua */
  .lingua { display: flex; height: 32px; border-radius: 9px; overflow: hidden;
            border: 1px solid rgba(255,255,255,.22); }
  .lingua button {
    height: 100%; padding: 0 11px; border: 0; background: rgba(255,255,255,.08);
    color: #bfe2cd; font: 700 12px/1 var(--mono); cursor: pointer;
  }
  .lingua button.on { background: #eaf5ee; color: #10382a; }

  /* --------------------------------------------------------- telaio */
  #app { display: flex; height: 100%; flex-direction: column; }
  #corpo { display: flex; flex: 1; min-height: 0; }

  #lato {
    width: 388px; min-width: 320px; flex: none;
    background: var(--carta); border-right: 1px solid var(--bordo-scuro);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #fisso { flex: none; }
  #scroll { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
  #scroll::-webkit-scrollbar { width: 10px; }
  #scroll::-webkit-scrollbar-thumb { background: #d6cdb8; border-radius: 6px; border: 3px solid var(--carta); }

  .sez {
    background: var(--scheda); border: 1px solid var(--bordo); border-radius: 14px;
    padding: 12px 14px 14px; margin: 10px 10px 0;
    box-shadow: 0 1px 2px rgba(20,30,24,.05);
  }
  #scroll .sez:last-child { margin-bottom: 10px; }
  .sez h2 {
    margin: 0 0 9px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .14em; color: var(--tenue2);
    display: flex; align-items: center; gap: 8px;
  }
  .sez h2 .conta { margin-left: auto; font: 11px/1 var(--mono); color: var(--tenue2); text-transform: none; letter-spacing: 0; }
  .riga { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  input[type=text], select {
    width: 100%; height: 36px; padding: 0 10px;
    border: 1px solid var(--bordo); border-radius: 10px; background: #fff;
    font: 13px/1 var(--mono); color: var(--inchiostro);
  }
  input:focus, select:focus { outline: 2px solid var(--verde-vivo); outline-offset: 1px; }

  .interruttori { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 9px; }
  label.ck {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    height: 30px; padding: 0 8px; border: 1px solid var(--bordo);
    border-radius: 9px; background: #fff; font-size: 12px; color: #3b463f;
  }
  label.ck:hover { background: #fffaf0; }
  label.ck input { accent-color: var(--verde); margin: 0; }
  label.ck:has(input:checked) { border-color: #cfe3d6; background: #f3faf5; color: #0b4d36; font-weight: 600; }

  button {
    height: 32px; padding: 0 12px; border: 1px solid var(--bordo-scuro);
    border-radius: 9px; background: #fff; color: #3b463f;
    font: 600 12.5px/1 inherit; font-family: inherit; cursor: pointer;
  }
  button:hover { background: #f5f0e3; }

  /* segmenti (Mappe / Pokémon / Allenatori) */
  .segm { display: flex; gap: 0; border: 1px solid var(--bordo); border-radius: 10px; overflow: hidden; background: #fff; }
  .segm button {
    flex: 1; height: 32px; border: 0; border-radius: 0; background: #fff;
    font: 600 12px/1 inherit; color: var(--tenue); border-right: 1px solid var(--bordo);
  }
  .segm button:last-child { border-right: 0; }
  .segm button.on { background: var(--verde); color: #fff; }

  /* ------------------------------------------------------- giocatori */
  .giocatore {
    display: flex; align-items: center; gap: 9px; padding: 7px 9px;
    border-radius: 10px; background: #f7f3e8; font-size: 12.5px;
    margin-bottom: 6px; line-height: 1.35;
  }
  .giocatore:last-child { margin-bottom: 0; }
  .giocatore .pallino { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(0,0,0,.08); }
  .vuoto { font-size: 12.5px; color: var(--tenue); line-height: 1.5; }

  /* --------------------------------------------------------- legenda */
  .legenda { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .legenda span { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tenue); }
  .legenda i { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }
  .legenda i.q { border-radius: 3px; }
  .legenda img.itm { width: 18px; height: 18px; flex: none; }

  /* ----------------------------------------------------------- liste */
  details.sez > summary {
    list-style: none; cursor: pointer;
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .14em; color: var(--tenue2);
  }
  details.sez > summary::-webkit-details-marker { display: none; }
  details.sez > summary::after { content: " \25BE"; }
  details.sez[open] > summary::after { content: " \25B4"; }

  ul.lista {
    list-style: none; margin: 9px 0 0; padding: 0; max-height: 210px; overflow: auto;
    border: 1px solid var(--bordo); border-radius: 10px; background: #fff;
  }
  ul.lista:empty { display: none; }
  ul.lista li {
    padding: 5px 9px; cursor: pointer; font-size: 13px;
    border-bottom: 1px solid #f0ebdd; display: flex; align-items: center;
    justify-content: space-between; gap: 8px;
  }
  ul.lista li:last-child { border-bottom: 0; }
  ul.lista li:hover { background: #f3faf5; }
  ul.lista li .muto { font: 11px/1 var(--mono); color: var(--tenue2); white-space: nowrap; }
  ul.lista li .sx { display: flex; align-items: center; gap: 7px; min-width: 0; }
  ul.lista li .sx span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ------------------------------------------------------ dettagli */
  .muto { color: var(--tenue); font-size: 12px; }
  #dett h3 {
    display: flex; align-items: center; gap: 9px;
    margin: 0 0 3px; font-size: 16px; font-weight: 700; letter-spacing: -.01em;
  }
  #dett h4 {
    margin: 14px 0 4px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .12em; color: var(--tenue2);
  }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  td, th { padding: 4px 5px; text-align: left; border-bottom: 1px solid #f0ebdd; vertical-align: middle; }
  th {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .1em; color: var(--tenue2); border-bottom-color: var(--bordo);
  }
  td.n { text-align: right; font: 12px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
  tr[data-k] td:first-child, tr[data-t] td:first-child { color: var(--verde); font-weight: 600; }
  tr[data-k]:hover, tr[data-t]:hover { background: #f3faf5; cursor: pointer; }
  img.ic { width: 30px; height: 30px; vertical-align: middle; }
  img.itm { width: 22px; height: 22px; vertical-align: middle; }
  .dono-chip { display: inline-flex; align-items: center; gap: 2px;
               background: #efe7d2; border: 1px solid var(--bordo);
               border-radius: 999px; padding: 2px 9px 2px 5px;
               margin: 2px 4px 2px 0; font-size: 12.5px; line-height: 1.5;
               white-space: nowrap; }
  img.oe { image-rendering: pixelated; object-fit: contain; object-position: bottom; }

  .torna-su {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px;
    padding: 3px 9px; border-radius: 8px; border: 1px solid var(--bordo);
    background: #fff; font-size: 12px; color: var(--tenue); cursor: pointer;
  }
  .torna-su:hover { background: #f3faf5; }

  /* Il Pokemon animato, in due forme.
     .monbw  la GIF di Nero/Bianco 2 (tools/sprite_bw.py): animazione vera,
             decine di fotogrammi, e' quella che si vuole vedere.
     .mon    il ripiego: lo sprite anteriore della decomp, 64x128 = due
             fotogrammi, alternati qui sotto. Serve per le specie che lo
             specchio non aveva. Le misure sono in percentuale apposta, cosi'
             la stessa regola vale a 40 px come a 80. */
  .monbw {
    flex: none; object-fit: contain; object-position: center bottom;
  }
  .mon {
    flex: none; image-rendering: pixelated;
    background-repeat: no-repeat; background-size: 100% 200%;
    animation: respiro 1.1s steps(1) infinite;
  }
  @keyframes respiro {
    0%, 49.9% { background-position: 0 0; }
    50%, 100% { background-position: 0 100%; }
  }

  /* la schedina accanto al personaggio cliccato */
  #scheda {
    position: absolute; display: none; z-index: 6; width: 264px;
    background: var(--scheda); border: 1px solid var(--bordo-scuro); border-radius: 13px;
    box-shadow: 0 16px 38px rgba(0,0,0,.45); overflow: hidden;
  }
  #scheda .testa {
    display: flex; align-items: center; gap: 9px; padding: 9px 11px;
    background: #f7f3e8; border-bottom: 1px solid var(--bordo);
  }
  #scheda .testa .cl { font-size: 11px; color: var(--tenue); line-height: 1.2; }
  #scheda .testa .nm { font-size: 15px; font-weight: 700; line-height: 1.2; }
  #scheda .testa .x {
    margin-left: auto; align-self: flex-start; width: 20px; height: 20px; padding: 0;
    border-radius: 6px; border: 1px solid var(--bordo); background: #fff;
    font: 700 12px/1 var(--mono); color: var(--tenue); cursor: pointer;
  }
  #scheda .corpo { padding: 9px 11px 11px; }
  #scheda .mons { display: flex; flex-wrap: wrap; gap: 6px; }
  #scheda .mons .m { width: 74px; text-align: center; }
  #scheda .mons .m .nm { font-size: 11px; font-weight: 600; line-height: 1.15; }
  #scheda .mons .m .lv { font: 10.5px/1.3 var(--mono); color: var(--tenue2); }

  /* il pannello a destra: i Pokemon della zona */
  #pannello-dx {
    position: absolute; display: none; z-index: 4;
    right: 12px; top: 52px; bottom: 52px; width: 306px;
    background: var(--scheda); border: 1px solid var(--bordo-scuro); border-radius: 13px;
    box-shadow: 0 16px 38px rgba(0,0,0,.42);
    display: none; flex-direction: column; overflow: hidden;
  }
  #pannello-dx.aperto { display: flex; }
  #pannello-dx .testa {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: #f7f3e8; border-bottom: 1px solid var(--bordo); flex: none;
  }
  #pannello-dx .testa .nm { font-size: 14.5px; font-weight: 700; line-height: 1.2; }
  #pannello-dx .testa .su { font-size: 11px; color: var(--tenue); }
  #pannello-dx .testa .x {
    margin-left: auto; width: 22px; height: 22px; padding: 0; border-radius: 6px;
    border: 1px solid var(--bordo); background: #fff; font: 700 12px/1 var(--mono);
    color: var(--tenue); cursor: pointer;
  }
  #pannello-dx .corpo { flex: 1; overflow-y: auto; padding: 10px 12px 14px; }
  #pannello-dx .corpo::-webkit-scrollbar { width: 9px; }
  #pannello-dx .corpo::-webkit-scrollbar-thumb { background: #d6cdb8; border-radius: 6px; border: 3px solid var(--scheda); }
  #pannello-dx h5 {
    margin: 12px 0 5px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .12em; color: var(--tenue2);
  }
  #pannello-dx h5:first-child { margin-top: 0; }
  .zmon {
    display: flex; align-items: center; gap: 9px; padding: 3px 5px;
    border-radius: 9px; cursor: pointer;
  }
  .zmon:hover { background: #f3faf5; }
  .zmon .chi { min-width: 0; flex: 1; }
  .zmon .nm { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
  .zmon .dt { font: 11px/1.35 var(--mono); color: var(--tenue2); }
  /* lo strumento tenuto dal selvatico */
  .ten { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 3px; }
  .t1 {
    display: inline-flex; align-items: center; gap: 3px;
    font: 10.5px/1.4 var(--mono); color: #6b5a1e;
    background: #fdf4dd; border: 1px solid #e8ce8f; border-radius: 6px;
    padding: 1px 5px 1px 3px;
  }
  .t1 img { width: 16px; height: 16px; }
  .t1 b { color: var(--ambra); }
  .zmon .pc {
    font: 700 12px/1 var(--mono); color: var(--verde);
    background: #eef7f1; border: 1px solid #cfe3d6; border-radius: 7px; padding: 4px 6px;
  }
  .squadra { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .mon-box {
    width: 84px; text-align: center; padding: 4px 2px 6px;
    border: 1px solid var(--bordo); border-radius: 10px; background: #fff;
  }
  .mon-box .nm { font-size: 11.5px; font-weight: 600; line-height: 1.2; }
  .mon-box .lv { font: 11px/1.3 var(--mono); color: var(--tenue2); }
  .mon-box .mon { margin: 0 auto; }

  .cartellino {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 11px; background: #f7f3e8; border: 1px solid var(--bordo);
  }
  .cartellino .chi { min-width: 0; }
  .cartellino .cl { font-size: 11.5px; color: var(--tenue); }
  .cartellino .nm { font-size: 15px; font-weight: 700; }

  /* ------------------------------------------------------------ tela */
  #tela-box {
    flex: 1; position: relative; min-width: 0;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(63,214,143,.10) 0%, rgba(15,52,40,0) 60%),
      var(--verde-cupo);
  }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  canvas.mano { cursor: pointer; }
  #tip {
    position: absolute; pointer-events: none; display: none; max-width: 300px;
    background: var(--scheda); border: 1px solid var(--bordo-scuro); border-radius: 10px;
    padding: 7px 11px; font-size: 12.5px; color: var(--inchiostro);
    box-shadow: 0 8px 20px rgba(0,0,0,.28);
  }
  #stato {
    position: absolute; left: 12px; bottom: 12px;
    display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px;
    background: rgba(9,30,23,.85); border: 1px solid rgba(255,255,255,.14);
    border-radius: 9px; font: 11.5px/1 var(--mono); color: #bfe2cd;
  }
  #zoom { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 6px; }
  #zoom button {
    width: 32px; height: 32px; padding: 0; border-radius: 9px;
    background: rgba(9,30,23,.85); border: 1px solid rgba(255,255,255,.14);
    color: #eaf5ee; font: 700 15px/1 var(--mono);
  }
  #zoom button:hover { background: rgba(22,160,110,.9); }

  #nav { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); }
  #nav button {
    height: 30px; padding: 0 12px; border-radius: 9px;
    background: rgba(9,30,23,.85); border: 1px solid rgba(255,255,255,.14);
    color: #eaf5ee; font: 600 12px/1 inherit; font-family: inherit;
  }
  #nav button:hover { background: rgba(22,160,110,.9); }
  #nav button.fuori { background: rgba(22,160,110,.88); border-color: rgba(255,255,255,.22); }
  #nav .dove {
    display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px;
    background: rgba(9,30,23,.85); border: 1px solid rgba(255,255,255,.14);
    border-radius: 9px; font: 11.5px/1 var(--mono); color: #bfe2cd;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .nascosto { display: none !important; }

  /* il menu che compare quando in un punto ci sono piu' porte */
  #scelta {
    position: absolute; display: none; z-index: 5; min-width: 210px; max-width: 320px;
    background: var(--scheda); border: 1px solid var(--bordo-scuro); border-radius: 12px;
    box-shadow: 0 14px 34px rgba(0,0,0,.4); overflow: hidden;
  }
  #scelta .tit {
    padding: 7px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .1em; color: var(--tenue2); border-bottom: 1px solid var(--bordo);
    background: #f7f3e8;
  }
  #scelta button {
    display: flex; width: 100%; align-items: center; gap: 8px; height: auto;
    padding: 8px 12px; border: 0; border-radius: 0; background: var(--scheda);
    font-size: 13px; text-align: left; border-bottom: 1px solid #f0ebdd;
  }
  #scelta button:last-child { border-bottom: 0; }
  #scelta button:hover { background: #f3faf5; }
  #scelta i {
    width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid;
    place-items: center; color: #fff; font-style: normal; font-size: 10px; font-weight: 800;
  }

  #avviso {
    position: absolute; left: 50%; top: 26%; transform: translateX(-50%);
    display: none; gap: 13px; align-items: flex-start; max-width: 560px;
    background: #fdf4dd; border: 1px solid #e8ce8f; border-left: 5px solid var(--ambra);
    border-radius: 12px; padding: 14px 18px; font-size: 14px; line-height: 1.55;
    color: var(--inchiostro); box-shadow: 0 12px 30px rgba(0,0,0,.35);
  }
  #avviso.visibile { display: flex; }
  #avviso .bang {
    display: grid; place-items: center; width: 24px; height: 24px; flex: none;
    border-radius: 50%; background: var(--ambra); color: #fff; font-weight: 800; font-size: 14px;
  }
  #avviso code { font: 12.5px/1.5 var(--mono); word-break: break-all; }

  /* --------------------------------------------------- la guida del Safari */
  .safari { font-size: 12.5px; line-height: 1.5; }
  .safari p { margin: 7px 0; }
  .safari h5 {
    margin: 13px 0 4px; font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .09em; color: var(--verde);
  }
  .safari .rif { font: 10px/1 var(--mono); color: var(--tenue2); white-space: nowrap; }
  .safari .sf1 { background: #eef6f1; border-left: 3px solid var(--verde-vivo); padding: 7px 10px; border-radius: 0 8px 8px 0; }
  .safari .sfw { background: #fdf4dd; border-left: 3px solid var(--ambra); padding: 7px 10px; border-radius: 0 8px 8px 0; }
  .safari .sfb { background: #fff4f2; border-left: 3px solid var(--rosso); padding: 7px 10px; border-radius: 0 8px 8px 0; }
  .safari .sft { width: 100%; border-collapse: collapse; margin: 5px 0; font: 11.5px/1.5 var(--mono); }
  .safari .sft th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--tenue2); font-weight: 700; }
  .safari .sft td, .safari .sft th { padding: 2px 6px; border-bottom: 1px solid var(--bordo); }

  /* =========================================================== MOBILE ======
   * La mappa su telefono era inservibile: la barra laterale si prendeva il 46%
   * dell'altezza e alla tela restava una striscia. I gesti c'erano gia' (pan a
   * un dito, pinch a due): mancava lo spazio.
   *
   * Qui la tela diventa TUTTO lo schermo e il pannello laterale scende come un
   * foglio dal basso, chiuso di default, che si apre col pulsante o
   * trascinando la maniglia. Cosi' si guarda la mappa a schermo pieno e i
   * dettagli si tirano su quando servono. */
  #maniglia, #apri-lato { display: none; }

  @media (max-width: 820px), (pointer: coarse) and (max-width: 1000px) {
    #corpo { flex-direction: column; position: relative; }

    #tela-box { order: 1; flex: 1 1 auto; min-height: 0; }

    #lato {
      order: 2; position: absolute; left: 0; right: 0; bottom: 0; z-index: 40;
      width: 100%; height: 72vh; max-height: 72vh;
      border-right: 0; border-top: 1px solid var(--bordo-scuro);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -8px 28px rgba(10,25,18,.28);
      transform: translateY(calc(100% - 46px));
      transition: transform .22s ease;
      touch-action: none;
    }
    #lato.su { transform: translateY(0); }

    /* la maniglia: e' anche il bottone che apre e chiude */
    #maniglia {
      display: block; height: 46px; flex: none; cursor: grab;
      border-radius: 16px 16px 0 0; background: var(--scheda);
      border-bottom: 1px solid var(--bordo);
    }
    #maniglia::before {
      content: ""; display: block; width: 42px; height: 4px; margin: 9px auto 0;
      border-radius: 3px; background: var(--bordo-scuro);
    }
    #maniglia span {
      display: block; text-align: center; font-size: 11.5px; font-weight: 700;
      color: var(--tenue); margin-top: 5px;
    }

    #fisso { padding: 8px 12px; }
    #scroll { padding: 0 12px 16px; }

    /* i controlli in cima: due colonne invece di una riga che sborda */
    #fisso .riga { flex-wrap: wrap; gap: 6px; }
    #fisso input[type=search], #fisso select { min-width: 0; flex: 1 1 100%; }

    /* bersagli grandi abbastanza per un dito (40 px e' il minimo sensato) */
    #nav button, #zoom button, #interruttori label, #interruttori button,
    #fisso button, #fisso label {
      min-height: 40px; min-width: 40px; font-size: 14px;
    }
    #zoom { bottom: 56px; }
    #stato { display: none; }         /* la riga tecnica non serve sul telefono */

    header { padding: 10px 0 11px; }
    header h1 { font-size: 17px; }
    header .sub, .targhe { display: none; }
    #tip { display: none; }           /* i tooltip col dito non hanno senso */
  }

  /* Telefoni stretti: la scheda a comparsa non deve mangiarsi tutto */
  @media (max-width: 420px) {
    #lato { height: 78vh; max-height: 78vh; }
    .safari .sft { font-size: 11px; }
  }

        for (var s = 0; s < mm.strumenti.length; s++) {

          var px2 = sx((oo.x + it.x + 0.5) * T), py2 = sy((oo.y + it.y + 0.5) * T);
          if (px2 < -20 || py2 < -20 || px2 > W + 20 || py2 > H + 20) continue;
          var kc2 = it.x + "," + it.y;
          if (celle[kc2] > 1 && !badgeFatti[kc2] && z * T >= 5) {
            badgeFatti[kc2] = 1;
            ctx.beginPath(); ctx.arc(px2 + lato * 0.55, py2 - lato * 0.55, Math.max(6, lato * 0.38), 0, Math.PI * 2);
            ctx.fillStyle = "#c03535"; ctx.fill();
            ctx.lineWidth = 1; ctx.strokeStyle = "#fff"; ctx.stroke();
            ctx.fillStyle = "#fff";
            ctx.font = "700 " + Math.max(9, Math.round(lato * 0.5)) + "px 'Segoe UI', system-ui, sans-serif";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("×" + celle[kc2], px2 + lato * 0.55, py2 - lato * 0.55 + 0.5);
          }
          var ii = iconaItem(it);
          if (ii && ii.complete && ii.naturalWidth && z * T >= 5) {
            ctx.imageSmoothingEnabled = false;
            if (it.nascosto) ctx.globalAlpha = 0.85;
            ctx.drawImage(ii, px2 - lato / 2, py2 - lato / 2, lato, lato);
            ctx.globalAlpha = 1;
            ctx.imageSmoothingEnabled = z < 1;
            if (it.nascosto) {
              // il rombo giallo: nel gioco questo strumento NON si vede
              ctx.beginPath();
              var r2 = lato * 0.30;
              ctx.moveTo(px2, py2 - lato / 2 - r2); ctx.lineTo(px2 + r2, py2 - lato / 2);
              ctx.lineTo(px2, py2 - lato / 2 + r2); ctx.lineTo(px2 - r2, py2 - lato / 2);
              ctx.closePath();
              ctx.fillStyle = "#e8c020"; ctx.fill();
              ctx.lineWidth = 1; ctx.strokeStyle = "#4a3a00"; ctx.stroke();
            } else if (it.dono) {
              ctx.beginPath(); ctx.arc(px2, py2, lato * 0.62, 0, Math.PI * 2);
              ctx.lineWidth = 2; ctx.strokeStyle = "#ff9b3b"; ctx.stroke();
            }
            continue;
          }
          var r = Math.max(3, Math.min(8, z * T * 0.4));
          ctx.beginPath(); ctx.arc(px2, py2, r, 0, Math.PI * 2);
          if (it.nascosto) { ctx.fillStyle = "#e8c020"; ctx.fill(); ctx.setLineDash([2, 2]); ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]); }
          else if (it.dono) { ctx.fillStyle = "#ff9b3b"; ctx.fill(); ctx.strokeStyle = "#111"; ctx.lineWidth = 1; ctx.stroke(); }
          else { ctx.fillStyle = "#e03a3a"; ctx.fill(); ctx.strokeStyle = "#111"; ctx.lineWidth = 1; ctx.stroke(); }
        }
      }
    }

    // 4-bis. i tile di Feebas (solo Percorso 119)
    //
    // Non sono "i sei punti": quelli il gioco li sorteggia per salvataggio e
    // da fuori non si possono sapere. Questi sono i 444 tile CANDIDATI - fuori
    // di qui Feebas non esce mai - e sono comunque l'informazione utile: dice
    // dove ha senso pescare e dove no.
    if (mostraFeebas) {
      for (var jf = 0; jf < chiavi.length; jf++) {
        var kf = chiavi[jf], mf = mappaDi(kf), of2 = origine(kf);
        if (!mf.feebas || !mf.feebas.length) continue;
        ctx.fillStyle = "rgba(64,196,222,.45)";
        ctx.strokeStyle = "rgba(9,86,105,.75)";
        ctx.lineWidth = 1;
        for (var q2 = 0; q2 < mf.feebas.length; q2++) {
          var fx = sx((of2.x + mf.feebas[q2][0]) * T), fy = sy((of2.y + mf.feebas[q2][1]) * T);
          var ts2 = T * z;
          if (fx < -ts2 || fy < -ts2 || fx > W || fy > H) continue;
          ctx.fillRect(fx, fy, ts2, ts2);
          if (ts2 >= 6) ctx.strokeRect(fx + 0.5, fy + 0.5, ts2 - 1, ts2 - 1);
        }
        // I TILE PIU' PROBABILI, quando i semi candidati sono ancora tanti:
        // oro pallido, tanto piu' acceso quanto piu' spesso quel tile compare
        // fra i semi ancora possibili.
        if (!feebas6[kf] && feebasProb[kf]) {
          var pr = feebasProb[kf], maxp = 0, kk2;
          for (kk2 in pr) if (pr[kk2] > maxp) maxp = pr[kk2];
          for (kk2 in pr) {
            var cc = kk2.split(","), fx2 = sx((of2.x + +cc[0]) * T), fy2 = sy((of2.y + +cc[1]) * T);
            var tp = T * z;
            if (fx2 < -tp || fy2 < -tp || fx2 > W || fy2 > H) continue;
            ctx.fillStyle = "rgba(232,192,32," + (0.25 + 0.6 * pr[kk2] / maxp).toFixed(2) + ")";
            ctx.fillRect(fx2, fy2, tp, tp);
          }
        }
        // I TILE DOVE HAI GIA' PESCATO: contorno verde, sono certezze.
        for (var qn = 0; qn < feebasNoti.length; qn++) {
          var nx = sx((of2.x + feebasNoti[qn][0]) * T), ny = sy((of2.y + feebasNoti[qn][1]) * T);
          var tn = T * z;
          if (nx < -tn || ny < -tn || nx > W || ny > H) continue;
          ctx.strokeStyle = "#3fd68f"; ctx.lineWidth = 2;
          ctx.strokeRect(nx + 1, ny + 1, tn - 2, tn - 2);
        }
        // I TUOI 6 (dal calcolatore, se usato): in ORO sopra i candidati.
        var sei = feebas6[kf];
        if (sei) {
          ctx.fillStyle = "rgba(232,192,32,.85)";
          ctx.strokeStyle = "#4a3a00";
          for (var q6 = 0; q6 < sei.length; q6++) {
            var gx = sx((of2.x + sei[q6][0]) * T), gy = sy((of2.y + sei[q6][1]) * T);
            var tg = T * z;
            if (gx < -tg || gy < -tg || gx > W || gy > H) continue;
            ctx.fillRect(gx, gy, tg, tg);
            ctx.strokeRect(gx + 0.5, gy + 0.5, tg - 1, tg - 1);
          }
        }
      }
    }

    // 4-ter. l'acqua fonda (immersione/riemersione): TUTTI i tile buoni,
    // non solo il pin - nel gioco ci si immerge da qualunque tile profondo.
    if (mostraPorte) {
      for (var js = 0; js < chiavi.length; js++) {
        var ks = chiavi[js], ms = mappaDi(ks), os2 = origine(ks);
        if (!ms.sub || !ms.sub.length) continue;
        ctx.fillStyle = "rgba(13,143,184,.30)";
        for (var qs = 0; qs < ms.sub.length; qs++) {
          var sx3 = sx((os2.x + ms.sub[qs][0]) * T), sy3 = sy((os2.y + ms.sub[qs][1]) * T);
          var ts3 = T * z;
          if (sx3 < -ts3 || sy3 < -ts3 || sx3 > W || sy3 > H) continue;
          ctx.fillRect(sx3, sy3, ts3, ts3);
        }
      }
    }

    // 5. nomi delle mappe
    if (mostraNomi && vista.tipo === "mondo") {
      ctx.font = "700 " + Math.max(11, Math.min(16, 11 + z * 6)) + "px 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (var n = 0; n < chiavi.length; n++) {
        var kn = chiavi[n], mn = mappaDi(kn), on = origine(kn);
        var cxp = sx((on.x + mn.w / 2) * T), cyp = sy((on.y + mn.h / 2) * T);
        if (mn.satellite_box) {
          cxp = sx((mn.satellite_box[0] + mn.satellite_box[2] / 2) * T);
          cyp = sy((mn.satellite_box[1] + mn.satellite_box[3] / 2) * T);
        }
        if (cxp < 0 || cyp < 0 || cxp > W || cyp > H) continue;
        // i SATELLITI si etichettano sempre: sono piccoli e staccati, e senza
        // nome restano "una roba" in mezzo al mare (riscontro di Lain)
        if (mn.w * T * z < 60 && !mn.satellite) continue;
        if (mn.satellite_parte) continue;   // il nome lo scrive il capogruppo
        // per un gruppo si scrive il nome della ZONA ("Parco Lotta"),
        // non quello della meta' su cui capita il riquadro
        var et = mn.satellite_nome ? G("mapsec", mn.satellite_nome, nomeMappa(mn)) : nomeMappa(mn);
        ctx.lineWidth = 3.5; ctx.strokeStyle = "rgba(8,26,20,.85)"; ctx.strokeText(et, cxp, cyp);
        ctx.fillStyle = "#f6f2e6"; ctx.fillText(et, cxp, cyp);
        // Al posto della riga lunga: una didascalia che dice DA DOVE si
        // arriva. Sta addosso al luogo, non attraversa la mappa.
        if (mn.satellite && mn.satellite_da && dati.mappe[mn.satellite_da] && z * T >= 5) {
          var da = String.fromCharCode(0x2937) + " " + t("satDa") + " " + nomeMappa(dati.mappe[mn.satellite_da]);
          var f0 = ctx.font;
          ctx.font = "600 " + Math.max(9, Math.min(13, 9 + z * 4)) + "px 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif";
          ctx.lineWidth = 3; ctx.strokeStyle = "rgba(8,26,20,.85)";
          ctx.strokeText(da, cxp, cyp + 15);
          ctx.fillStyle = "#ffcf3d"; ctx.fillText(da, cxp, cyp + 15);
          ctx.font = f0;
        }
      }
    }

    // 6. le porte
    if (mostraPorte) {
      var pv = porteVisibili();
      for (var d2 = 0; d2 < pv.length; d2++) {
        var pp = pv[d2];
        if (pp.px < -20 || pp.py < -20 || pp.px > W + 20 || pp.py > H + 20) continue;
        disegnaPorta(pp.px, pp.py, pp.porta.tipo, pp.s, pp.porta.stessa);
      }
    }

    // 7. i giocatori
    for (var p = 0; p < giocatori.length; p++) {
      var g = giocatori[p], kg = chiaveDi(g.gruppo, g.numero), og = origine(kg);
      if (!og) continue;
      var pa = posAnim(g.peer);
      var tx2 = (pa.x != null ? pa.x : g.x) - MAP_OFFSET, ty2 = (pa.y != null ? pa.y : g.y) - MAP_OFFSET;
      var bx = sx((og.x + tx2) * T), by = sy((og.y + ty2) * T);
      var sw = T * z, sh = 2 * T * z;
      var stale = (Date.now() / 1000 - g.t) > 15;
      ctx.globalAlpha = stale ? 0.45 : 1;
      var DIR_NOMI = { 1: "giu", 2: "su", 3: "sx", 4: "dx" };
      // LA DIREZIONE (2026-08-25): mentre CAMMINA comanda il delta del passo
      // (dax->x), non il campo dir del payload - un pacchetto STATO o un dir
      // fuori range faceva girare lo sprite a caso a meta' passo. Da fermo
      // vale g.dir, e se g.dir non e' 1-4 si tiene l'ULTIMA direzione vista
      // invece di scattare a sud.
      var dnome = pa.cammina && pa.dir ? pa.dir : DIR_NOMI[g.dir];
      var a0 = anim[g.peer];
      if (!dnome && a0) dnome = a0.dirUlt;
      if (!dnome) dnome = "giu";
      if (a0) a0.dirUlt = dnome;
      // il fotogramma: fermo, oppure il passo - il piede si alterna PER
      // PASSO (parita' del contatore), non dentro il passo: prima ogni passo
      // faceva A poi B e la gamba sembrava tremare
      // IL MODO (2026-08-30): bici, surf e corsa, non solo la camminata.
      // Lo stato viaggia nel protocollo da sempre - byte 11 avatarState
      // (PLAYER_AVATAR_STATE_*) e byte 2 speed (SPEED_*) di NetEvent - ma qui
      // non veniva letto, e chi era in bici o in surf appariva a piedi.
      // La corsa si mostra solo MENTRE si cammina: da fermo il gioco stesso
      // rimette la posa normale, e un allenatore immobile in posa di corsa
      // sembrerebbe un difetto.
      var modo = "";
      if (g.avatar === 1) modo = "mach";
      else if (g.avatar === 2) modo = "acro";
      else if (g.avatar === 3 || g.avatar === 4) modo = "surf";   // 4 = sott'acqua
      else if (g.speed === 1 && pa.cammina) modo = "corsa";
      // Il surf non ha fotogrammi di andatura: nella decomp le andature
      // rimandano allo stesso disegno (sPicTable_BrendanSurfing), perche' a
      // dondolare e' la bolla del Pokemon, non l'allenatore.
      var animato = (modo !== "surf");
      var largo2 = (modo === "mach" || modo === "acro" || modo === "surf");
      var suff = (animato && pa.cammina && pa.f) ? (pa.f === 1 ? "_a" : "_b") : "";
      var nomeSprite = (g.genere === 1 ? "may" : "brendan") + "_"
                     + (modo ? modo + "_" : "") + dnome;
      var spr = img("sprite/" + nomeSprite + suff + ".png", sprite);
      if (!(spr.complete && spr.naturalWidth) && suff) {
        // il fotogramma di camminata non c'e' (dati generati da una versione
        // precedente): si ripiega sul fermo invece di lasciare un buco.
        spr = img("sprite/" + nomeSprite + ".png", sprite);
      }
      if (!(spr.complete && spr.naturalWidth) && modo) {
        // nemmeno il modo c'e' (sprite generati prima del 30/08): si ripiega
        // sull'allenatore a piedi, che c'e' da sempre.
        spr = img("sprite/" + (g.genere === 1 ? "may" : "brendan") + "_"
                  + dnome + ".png", sprite);
        largo2 = false;
      }
      if (z * T >= 6 && spr.complete && spr.naturalWidth) {
        // I disegni di bici e surf sono 32x32 (due tile), non 16x32: si
        // allargano al doppio e si centrano sul tile, tenendo la stessa riga
        // di base - i piedi restano sul fondo del tile come a piedi.
        var dw = largo2 ? sw * 2 : sw;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(spr, bx - (dw - sw) / 2, by - sh / 2, dw, sh);
        ctx.imageSmoothingEnabled = z < 1;
      } else {
        ctx.beginPath(); ctx.arc(bx + sw / 2, by + sw / 2, Math.max(5, sw / 2), 0, Math.PI * 2);
        ctx.fillStyle = g.io ? "#7fb2ff" : "#3fd68f"; ctx.fill(); ctx.strokeStyle = "#08211a"; ctx.lineWidth = 1.5; ctx.stroke();
      }
      var STATO_NOMI = { 0: "", 1: "in lotta", 2: "in un dialogo", 3: "nel menu", 4: "nella Borsa", 5: "nella Squadra", 6: "nel Pokédex", 7: "nel PokéNav" };
      var STATO_EN = { 0: "", 1: "in battle", 2: "in a dialog", 3: "in the menu", 4: "in the Bag", 5: "in the Party", 6: "in the Pokédex", 7: "in the PokéNav" };
      var st = (lang === "it" ? STATO_NOMI : STATO_EN)[g.stato] || "";
      var eti = g.label + (st ? " · " + st : "");
      ctx.font = "700 12px 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      var tw = ctx.measureText(eti).width + 12, ex = bx + sw / 2, ey = by - sh / 2 - 4;
      ctx.fillStyle = g.io ? "rgba(30,74,148,.94)" : "rgba(11,77,54,.94)";
      ctx.beginPath();
      if (ctx.roundRect) { ctx.roundRect(ex - tw / 2, ey - 18, tw, 18, 5); ctx.fill(); }
      else ctx.fillRect(ex - tw / 2, ey - 18, tw, 18);
      ctx.fillStyle = "#f6f2e6"; ctx.fillText(eti, ex, ey - 3);
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(disegna);
  }

  // ---------------------------------------------------------------- porte
  function dimPorta() { return Math.max(9, Math.min(20, T * z * 0.85)); }

  function porteVisibili() {
    var out = [];
    if (!dati) return out;
    var chiavi = mappeDellaVista(), s = dimPorta();
    for (var i = 0; i < chiavi.length; i++) {
      var k = chiavi[i], m = mappaDi(k), o = origine(k);
      var porte = m.porte || [];
      for (var j = 0; j < porte.length; j++) {
        var w = porte[j];
        out.push({ porta: w, mappa: m, key: k, s: s,
                   px: sx((o.x + w.x + 0.5) * T), py: sy((o.y + w.y + 0.5) * T) });
      }
    }
    return out;
  }

  function disegnaPorta(px, py, tipo, s, stessa) {
    var col = stessa ? PORTA_STESSA_COL : (PORTA_COL[tipo] || "#2f6bc0"), r = s / 2;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(px - r, py - r, s, s, Math.max(2, s * 0.28));
    else ctx.rect(px - r, py - r, s, s);
    ctx.fillStyle = col; ctx.fill();
    ctx.restore();
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(8,26,20,.75)"; ctx.stroke();
    if (s >= 12) {
      ctx.fillStyle = "#fff";
      ctx.font = "700 " + Math.round(s * 0.62) + "px 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(stessa ? SIMBOLO_STESSA : PORTA_FRECCIA[tipo] || "\u2192", px, py + 0.5);
    }
  }

  // TUTTE le porte sotto il puntatore, non solo la piu' vicina: in parecchi
  // posti (i Centri, i palazzi del Fronte) piu' usci finiscono sullo stesso
  // tile o su tile adiacenti, e sceglierne una a caso vorrebbe dire portare
  // l'utente in un posto che non ha chiesto. Se sono piu' d'una, si chiede.
  function porteSotto(px, py) {
    if (!mostraPorte) return [];
    var pv = porteVisibili(), out = [];
    for (var i = 0; i < pv.length; i++) {
      var p = pv[i], d = Math.hypot(p.px - px, p.py - py);
      // bersaglio generoso: almeno un tile e mezzo di raggio - il pin da 7px
      // della vista larga era il motivo per cui "le stanze dei Regi non si
      // aprivano": si mancava di due pixel e si prendeva la mappa
      if (d <= Math.max(p.s / 2 + 3, T * z * 1.5)) out.push({ p: p, d: d });
    }
    out.sort(function (a, b) { return a.d - b.d; });
    return out.map(function (x) { return x.p; });
  }

  // Le porte VICINE a quella colpita. L'attivazione resta stretta (si clicca
  // il pin, non un'area vaga), ma una volta colpita si guarda se accanto ce
  // ne sono altre: nelle palestre e nei Centri l'uscita e le scale stanno su
  // tile confinanti, e a zoom normale i due pin non si sovrappongono - senza
  // questo, il menu di scelta sarebbe comparso solo guardando tutta Hoenn,
  // cioe' mai quando serve (2026-08-22).
  function porteCompagne(scelta) {
    var pv = porteVisibili(), raggio = Math.max(scelta.s, T * z * 1.4), out = [scelta.porta];
    var visti = {};
    // i passaggi interni hanno tutti la stessa destinazione (questa mappa)
    // ma un ARRIVO diverso: si distinguono per il tile d'arrivo
    function chiavePorta(w) { return w.stessa ? (w.a + ":" + w.ax + "," + w.ay) : w.a; }
    visti[chiavePorta(scelta.porta)] = 1;
    for (var i = 0; i < pv.length; i++) {
      var p = pv[i];
      if (p.porta === scelta.porta) continue;
      if (Math.hypot(p.px - scelta.px, p.py - scelta.py) > raggio) continue;
      // due usci che portano allo stesso posto sono UNA scelta sola: elencarli
      // due volte con la stessa etichetta non aiuta nessuno
      if (visti[chiavePorta(p.porta)]) continue;
      visti[chiavePorta(p.porta)] = 1;
      out.push(p.porta);
    }
    return out;
  }

  // Le uscite, senza doppioni per destinazione (un Centro ne ha due sullo
  // stesso tappeto, e nel menu comparivano due righe identiche).
  function usciteDistinte() {
    var visti = {}, out = [];
    uscite().forEach(function (w) {
      if (visti[w.a]) return;
      visti[w.a] = 1;
      out.push(w);
    });
    return out;
  }

  function descriviPorta(w) {
    if (w.dinamica) return t("dinamica");
    var dest = dati.mappe[w.a];
    if (w.stessa) return t("stessaMappa") + " (" + w.ax + "," + w.ay + ")";
    return t(w.tipo) + ": " + (dest ? nomeMappa(dest) : w.nome) + (w.evento ? " (" + t("viaEvento") + ")" : "") + " \u2014 " + t("clicMappa");
  }

  function attraversa(w) {
    if (w.dinamica || !w.a) return;
    // PASSAGGIO INTERNO (2026-08-25): la mappa e' la stessa, cambia il
    // punto. Si sposta la vista sull'arrivo tenendo la cronologia, cosi'
    // 'Indietro' riporta dov'eri. Prima questi warp erano scartati del
    // tutto e la camera dei Regi risultava irraggiungibile.
    if (w.stessa) {
      cronologia.push({ vista: { tipo: vista.tipo, id: vista.id, key: vista.key },
                        cx: cx, cy: cy, z: z, sel: selezionata });
      if (cronologia.length > 40) cronologia.shift();
      segui = ""; $("sel-segui").value = "";
      chiudiScheda(); chiudiPannello();
      centraSu(w.a, w.ax, w.ay, Math.max(z, 2.2));
      selezionata = w.a;
      mostraMappa(w.a);
      aggiornaNav();
      return;
    }   // l'uscita "da dove sei entrato" non ha una destinazione fissa
    chiudiScheda(); chiudiPannello();
    cronologia.push({ vista: { tipo: vista.tipo, id: vista.id, key: vista.key },
                      cx: cx, cy: cy, z: z, sel: selezionata });
    if (cronologia.length > 40) cronologia.shift();
    segui = ""; $("sel-segui").value = "";
    var k = w.a, m = mappaDi(k);
    if (!m) return;
    selezionata = k;
    impostaVista(m.mondo ? { tipo: "mondo", id: m.mondo } : { tipo: "mappa", key: k }, false);
    centraSu(k, w.ax === null ? undefined : w.ax, w.ay === null ? undefined : w.ay,
             Math.max(z, m.esterno ? 1.5 : 2.2));
    mostraMappa(k);
    aggiornaNav();
  }

  function indietro() {
    var v = cronologia.pop();
    if (!v) return;
    vista = v.vista.tipo === "mondo" ? { tipo: "mondo", id: v.vista.id } : { tipo: "mappa", key: v.vista.key };
    $("sel-mondo").value = vista.tipo === "mondo" ? "mondo:" + vista.id : "mappa:" + vista.key;
    cx = v.cx; cy = v.cy; z = v.z; selezionata = v.sel;
    if (selezionata) mostraMappa(selezionata);
    dirty = true;
    aggiornaNav();
  }

  function uscite() {
    if (!dati || !vista || vista.tipo !== "mappa") return [];
    var m = mappaDi(vista.key);
    if (!m) return [];
    return (m.porte || []).filter(function (w) { return w.tipo === "esce"; });
  }

  function aggiornaNav() {
    var dove = $("nav-dove"), bi = $("btn-indietro"), be = $("btn-esci");
    if (!dati || !vista) return;
    dove.textContent = vista.tipo === "mondo"
      ? (dati.mondi[vista.id] ? nomeMondo(dati.mondi[vista.id]) : vista.id)
      : nomeMappaK(vista.key);
    bi.classList.toggle("nascosto", cronologia.length === 0);
    var u = uscite();
    be.classList.toggle("nascosto", u.length === 0);
  }

  // il menu delle porte
  function chiudiScelta() { $("scelta").style.display = "none"; }
  function apriScelta(px, py, titolo, elenco) {
    var el = $("scelta");
    var h = "<div class=tit>" + titolo + "</div>";
    elenco.forEach(function (w, i) {
      var dest = dati.mappe[w.a];
      var eti = w.stessa ? (t("stessaMappa") + " (" + w.ax + "," + w.ay + ")")
                         : (w.dinamica ? t("dinamica") : (dest ? nomeMappa(dest) : w.nome));
      h += "<button data-i='" + i + "'><i style='background:" + (w.stessa ? PORTA_STESSA_COL : (PORTA_COL[w.tipo] || "#2f6bc0")) + "'>"
        + (PORTA_FRECCIA[w.tipo] || "\u2192") + "</i><span>" + eti + "</span></button>";
    });
    el.innerHTML = h;
    el.style.display = "block";
    var r = $("tela-box").getBoundingClientRect();
    el.style.left = Math.min(px + 8, r.width - el.offsetWidth - 8) + "px";
    el.style.top = Math.min(py + 8, r.height - el.offsetHeight - 8) + "px";
    Array.prototype.forEach.call(el.querySelectorAll("button"), function (b) {
      b.onclick = function () { chiudiScelta(); attraversa(elenco[+b.getAttribute("data-i")]); };
    });
  }

  $("btn-indietro").onclick = indietro;
  $("btn-esci").onclick = function () {
    var u = usciteDistinte();
    if (u.length === 1) return attraversa(u[0]);
    if (u.length > 1) {
      var r = $("btn-esci").getBoundingClientRect(), b = $("tela-box").getBoundingClientRect();
      apriScelta(r.left - b.left, r.bottom - b.top, t("uscite"), u);
    }
  };
  window.addEventListener("keydown", function (e) {
    var n = e.target && e.target.tagName;
    if (n === "INPUT" || n === "SELECT" || n === "TEXTAREA") return;
    if (e.key === "Escape") {
      // prima si chiude quello che e' aperto sopra la mappa; solo se non c'e'
      // niente di aperto, Esc torna indietro
      e.preventDefault();
      var qualcosa = $("scheda").style.display === "block"
        || $("pannello-dx").classList.contains("aperto")
        || $("scelta").style.display === "block";
      chiudiScelta(); chiudiScheda(); chiudiPannello();
      if (!qualcosa) indietro();
      return;
    }
    if (e.key === "Backspace") { e.preventDefault(); chiudiScelta(); indietro(); }
  });

  // ---------------------------------------------------------------- interazione
  var drag = null, mosso = false;
  tela.addEventListener("mousedown", function (e) { drag = { x: e.clientX, y: e.clientY, cx: cx, cy: cy }; mosso = false; tela.classList.add("drag"); });
  window.addEventListener("mousemove", function (e) {
    if (drag) {
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) mosso = true;
      cx = drag.cx - dx / z; cy = drag.cy - dy / z; dirty = true;
      if (mosso) { segui = ""; $("sel-segui").value = ""; }
    } else tooltip(e);
  });
  window.addEventListener("mouseup", function (e) {
    if (!drag) return;
    tela.classList.remove("drag");
    if (!mosso) clic(e);
    drag = null;
  });
  tela.addEventListener("wheel", function (e) {
    e.preventDefault(); chiudiScelta();
    var r = tela.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    var gxx = gx(px), gyy = gy(py);
    var f = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    z = Math.max(0.03, Math.min(8, z * f));
    cx = gxx - (px - tela.clientWidth / 2) / z; cy = gyy - (py - tela.clientHeight / 2) / z;
    dirty = true;
  }, { passive: false });
  function zooma(f) { z = Math.max(0.03, Math.min(8, z * f)); dirty = true; }
  $("btn-piu").onclick = function () { zooma(1.35); };
  $("btn-meno").onclick = function () { zooma(1 / 1.35); };
  var tocchi = null;
  tela.addEventListener("touchstart", function (e) {
    if (e.touches.length === 1) { var tt = e.touches[0]; drag = { x: tt.clientX, y: tt.clientY, cx: cx, cy: cy }; mosso = false; }
    else if (e.touches.length === 2) { tocchi = { d: dist(e.touches), z: z }; drag = null; }
  }, { passive: true });
  tela.addEventListener("touchmove", function (e) {
    if (e.touches.length === 1 && drag) { var tt = e.touches[0]; cx = drag.cx - (tt.clientX - drag.x) / z; cy = drag.cy - (tt.clientY - drag.y) / z; dirty = true; }
    else if (e.touches.length === 2 && tocchi) { z = Math.max(0.03, Math.min(8, tocchi.z * dist(e.touches) / tocchi.d)); dirty = true; }
  }, { passive: true });
  tela.addEventListener("touchend", function () { drag = null; tocchi = null; });
  function dist(tt) { var dx = tt[0].clientX - tt[1].clientX, dy = tt[0].clientY - tt[1].clientY; return Math.sqrt(dx * dx + dy * dy); }

  function mappaSotto(px, py) {
    var gxx = gx(px) / T, gyy = gy(py) / T;
    var chiavi = mappeDellaVista();
    for (var i = chiavi.length - 1; i >= 0; i--) {
      var k = chiavi[i], m = mappaDi(k), o = origine(k);
      if (gxx >= o.x && gyy >= o.y && gxx < o.x + m.w && gyy < o.y + m.h) return { key: k, tx: Math.floor(gxx - o.x), ty: Math.floor(gyy - o.y) };
    }
    return null;
  }

  function strumentoSotto(px, py) {
    if (!mostraStrumenti) return null;
    var chiavi = mappeDellaVista(), best = null, bd = Math.max(10, T * z * 0.8);
    for (var j = 0; j < chiavi.length; j++) {
      var km = chiavi[j], mm = mappaDi(km), oo = origine(km);
      for (var s = 0; s < mm.strumenti.length; s++) {
        var it = mm.strumenti[s];
        var d = Math.hypot(sx((oo.x + it.x + 0.5) * T) - px, sy((oo.y + it.y + 0.5) * T) - py);
        if (d < bd) { bd = d; best = { item: it, mappa: mm, key: km }; }
      }
    }
    return best;
  }

  function personaggioSotto(px, py) {
    if (!mostraPersonaggi) return null;
    var chiavi = mappeDellaVista(), best = null, bd = Math.max(10, T * z);
    for (var j = 0; j < chiavi.length; j++) {
      var km = chiavi[j], mm = mappaDi(km), oo = origine(km);
      for (var q = 0; q < mm.personaggi.length; q++) {
        var pe = mm.personaggi[q];
        var d = Math.hypot(sx((oo.x + pe.x + 0.5) * T) - px, sy((oo.y + pe.y + 0.5) * T) - py);
        if (d < bd) { bd = d; best = { pers: pe, mappa: mm, key: km }; }
      }
    }
    return best;
  }

  // I doni di un personaggio, nella lingua scelta (doni_c porta le costanti).
  function nomiDoni(pe) {
    if (!pe.doni) return [];
    return pe.doni.map(function (n, i) {
      var c = pe.doni_c && pe.doni_c[i];
      return c ? G("items", c, n) : n;
    });
  }

  // Gli stessi doni, ma CON L'ICONA VERA accanto al nome (richiesta di Lain,
  // 2026-08-25: nella schedina si leggeva solo il testo e bisognava
  // indovinare che oggetto fosse). L'icona e' quella del gioco, gia'
  // esportata da gen_mappa.py; se per quel dono manca la costante si mostra
  // il solo nome invece di un buco.
  function donoChip(nome, cost, lato) {
    lato = lato || 20;
    var img = (cost && dati.item && dati.item[cost])
      ? "<img class=itm src='mappa/" + dati.item[cost] + "' alt='' style='width:" + lato
        + "px;height:" + lato + "px;vertical-align:-4px;margin-right:4px'>"
      : "";
    return "<span class=dono-chip>" + img + nome + "</span>";
  }
  function doniConIcona(pe, lato) {
    var nomi = nomiDoni(pe);
    return nomi.map(function (n, i) {
      return donoChip(n, pe.doni_c && pe.doni_c[i], lato);
    }).join("");
  }

  function descriviPersonaggio(pe) {
    var nome = nomePersonaggio(pe);
    if (pe.squadra && pe.squadra.length)
      nome += " \u2014 " + pe.squadra.map(function (s) { return nomeSpecie(s.specie, s.cost) + " " + t("lvl") + s.lv; }).join(", ");
    if (pe.doni) nome += " \u2014 " + t("dono") + ": " + nomiDoni(pe).join(", ");
    if (pe.tipo === "allenatore" && pe.soldi) nome += " \u2014 " + t("premio") + " " + pe.soldi + " \u00a5";
    return nome;
  }

  function giocatoreSotto(px, py) {
    for (var p = 0; p < giocatori.length; p++) {
      var g = giocatori[p], og = origine(chiaveDi(g.gruppo, g.numero));
      if (!og) continue;
      var bx = sx((og.x + g.x - MAP_OFFSET + 0.5) * T), by = sy((og.y + g.y - MAP_OFFSET) * T);
      if (Math.abs(bx - px) < Math.max(8, T * z) && py > by - 2 * T * z - 20 && py < by + T * z) return g;
    }
    return null;
  }

  function tooltip(e) {
    var r = tela.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    var tip = $("tip");
    if (px < 0 || py < 0 || px > r.width || py > r.height || !dati || !vista) { tip.style.display = "none"; return; }
    var testo = "", cursore = false;
    var po = porteSotto(px, py);
    var g = po.length ? null : giocatoreSotto(px, py);
    if (po.length) {
      cursore = true;
      var comp = porteCompagne(po[0]);
      testo = comp.length === 1 ? descriviPorta(comp[0])
        : comp.length + " " + t("porte").toLowerCase() + " \u2014 " + t("clicMappa");
    } else if (g) {
      testo = g.label + " · " + nomeMappaK(chiaveDi(g.gruppo, g.numero)) + " (" + (g.x - MAP_OFFSET) + "," + (g.y - MAP_OFFSET) + ")";
    } else {
      var st = strumentoSotto(px, py), ps = personaggioSotto(px, py);
      if (st && (!ps || st.item.dono !== true)) {
        cursore = true;
        testo = (st.item.nascosto ? t("nascosto") + ": " : st.item.dono ? t("dono") + ": " : "")
          + nomeItem(st.item) + " · " + nomeMappa(st.mappa);
      } else if (ps) {
        cursore = true;
        testo = descriviPersonaggio(ps.pers) + " · " + nomeMappa(ps.mappa);
      } else {
        var ms = mappaSotto(px, py);
        if (ms) {
          var pd = portaDiveSuTile(ms.key, ms.tx, ms.ty);
          if (pd) { cursore = true; testo = descriviPorta(pd); }
          else testo = nomeMappaK(ms.key) + " (" + ms.tx + "," + ms.ty + ")";
        }
      }
    }
    tela.classList.toggle("mano", cursore);
    if (!testo) { tip.style.display = "none"; return; }
    tip.textContent = testo; tip.style.display = "block";
    tip.style.left = Math.min(px + 14, r.width - 310) + "px"; tip.style.top = (py + 14) + "px";
  }

  // La porta di immersione/riemersione della mappa, se il tile cliccato e'
  // acqua fonda: ci si immerge da QUALUNQUE tile profondo, quindi tutti i
  // tile `sub` navigano come il pin.
  function portaDiveSuTile(key, tx, ty) {
    var m = mappaDi(key);
    if (!m || !m.sub || !m.sub.length) return null;
    if (!m._subSet) {
      m._subSet = {};
      for (var i = 0; i < m.sub.length; i++) m._subSet[m.sub[i][0] + "," + m.sub[i][1]] = 1;
    }
    if (!m._subSet[tx + "," + ty]) return null;
    var porte = m.porte || [];
    for (var j = 0; j < porte.length; j++) {
      if (porte[j].tipo === "immersione" || porte[j].tipo === "riemersione") return porte[j];
    }
    return null;
  }

  function clic(e) {
    var r = tela.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    chiudiScelta();
    // 1) le porte vincono: sono controlli sovrapposti alla mappa
    var po = porteSotto(px, py);
    if (po.length) {
      var comp = porteCompagne(po[0]);
      if (comp.length === 1) {
        if (comp[0].dinamica) {
          // niente destinazione fissa: si spiega, non si naviga
          var tip = $("tip");
          tip.textContent = t("dinamica"); tip.style.display = "block";
          tip.style.left = Math.min(px + 14, r.width - 310) + "px"; tip.style.top = (py + 14) + "px";
          setTimeout(function () { tip.style.display = "none"; }, 2500);
          return;
        }
        return attraversa(comp[0]);
      }
      return apriScelta(px, py, t("scegli"), comp);
    }
    // 2) un personaggio: schedina qui accanto, piu' la scheda intera nel fianco
    var ps = personaggioSotto(px, py);
    if (ps) { apriSchedaPersonaggio(ps.pers, ps.key, px, py); mostraPersonaggio(ps.pers, ps.key); return; }
    chiudiScheda();
    // 3) uno strumento - se sulla stessa cella ce n'e' piu' d'uno (il
    // distintivo xN), si sceglie da un menu invece di prendere il primo
    var st = strumentoSotto(px, py);
    if (st) {
      var mm2 = mappaDi(st.key), stessi = [];
      for (var q3 = 0; q3 < mm2.strumenti.length; q3++) {
        var alt = mm2.strumenti[q3];
        if (alt.x === st.item.x && alt.y === st.item.y) stessi.push(alt);
      }
      if (stessi.length > 1) return apriSceltaStrumenti(px, py, stessi, st.key);
      mostraStrumento(st.item, st.key);
      return;
    }
    // 4) l'acqua fonda: qualunque tile `sub` naviga come il pin di immersione
    var ms = mappaSotto(px, py);
    if (ms) {
      var pd = portaDiveSuTile(ms.key, ms.tx, ms.ty);
      if (pd) return attraversa(pd);
      // 5) la zona: il pannello a destra coi Pokemon che ci vivono
      selezionata = ms.key; mostraMappa(ms.key); apriPannelloMappa(ms.key);
      dirty = true; aggiornaNav();
    }
  }

  // il menu degli strumenti sovrapposti: stessa faccia del menu delle porte
  function apriSceltaStrumenti(px, py, elenco, key) {
    var el = $("scelta");
    var h = "<div class=tit>" + t("cosaCella") + "</div>";

      h += "<button data-i='" + i + "'>" + img + "<span>" + nomeItem(s)
        + (s.nascosto ? " (" + t("nascosto") + ")" : s.dono ? " (" + t("dono") + ")" : "") + "</span></button>";
    });
    el.innerHTML = h;
    el.style.display = "block";

    el.style.left = Math.min(px + 8, r.width - el.offsetWidth - 8) + "px";
    el.style.top = Math.min(py + 8, r.height - el.offsetHeight - 8) + "px";
    Array.prototype.forEach.call(el.querySelectorAll("button"), function (b) {
      b.onclick = function () { chiudiScelta(); mostraStrumento(elenco[+b.getAttribute("data-i")], key); };
    });
  }
  $("tela-box").addEventListener("mousedown", function (e) { if (e.target === tela) chiudiScelta(); });

  // ---------------------------------------------------------------- pannello
  function costruisciSelettoreMondi() {
    var sel = $("sel-mondo");
    var mondi = Object.keys(dati.mondi).sort(function (a, b) { return a === "hoenn" ? -1 : b === "hoenn" ? 1 : dati.mondi[a].nome.localeCompare(dati.mondi[b].nome); });
    var val = sel.value;
    sel.innerHTML = "";
    var og = document.createElement("optgroup"); og.label = lang === "it" ? "Mondi" : "Worlds";
    mondi.forEach(function (id) {

      og.appendChild(o);
    });
    sel.appendChild(og);
    var og2 = document.createElement("optgroup"); og2.label = lang === "it" ? "Singole mappe" : "Single maps";
    Object.keys(dati.mappe).sort(function (a, b) { return nomeMappaK(a).localeCompare(nomeMappaK(b)); })
      .forEach(function (k) {
        var o = document.createElement("option"); o.value = "mappa:" + k;
        o.textContent = nomeMappaK(k) + "  [" + k + "]";
        og2.appendChild(o);

    sel.appendChild(og2);
    if (val) sel.value = val;
    sel.onchange = function () {

      aggiornaNav();
    };
  }

  // ------------------------------------------------------------- ricerca
  function costruisciIndiceAllenatori() {
    if (indiceAllenatori) return indiceAllenatori;
    indiceAllenatori = [];
    Object.keys(dati.mappe).forEach(function (k) {
      (dati.mappe[k].personaggi || []).forEach(function (p) {
        if (p.tipo === "allenatore") indiceAllenatori.push({ p: p, key: k });
      });
    });
    return indiceAllenatori;
  }

  function aggiornaRisultati() {
    var q = ($("cerca").value || "").trim().toLowerCase();
    var ul = $("risultati"); ul.innerHTML = "";
    if (modoCerca !== "specie") { evidenziate = {}; dirty = true; }
    if (modoCerca === "mappe") {
      var chiavi = Object.keys(dati.mappe).filter(function (k) {
        return !q || nomeMappaK(k).toLowerCase().indexOf(q) >= 0 || k === q;
      });
      chiavi.sort(function (a, b) {
        var ma = dati.mappe[a], mb = dati.mappe[b];
        return (mb.esterno - ma.esterno) || nomeMappaK(a).localeCompare(nomeMappaK(b));
      });
      chiavi.slice(0, 300).forEach(function (k) {
        var li = document.createElement("li");
        li.innerHTML = "<span class=sx><span>" + nomeMappaK(k) + "</span></span><span class=muto>" + k + "</span>";
        li.onclick = function () { selezionata = k; centraSu(k, undefined, undefined, Math.max(z, 1)); mostraMappa(k); aggiornaNav(); };
        ul.appendChild(li);
      });
    } else if (modoCerca === "specie") {
      evidenziate = {}; dirty = true;
      if (!q) return;
      var nomi = Object.keys(dati.specie).filter(function (n) {
        var s = dati.specie[n];
        return n.toLowerCase().indexOf(q) >= 0 || nomeSpecie(n, s.cost).toLowerCase().indexOf(q) >= 0;
      }).sort();
      nomi.slice(0, 60).forEach(function (n) {
        var s = dati.specie[n], li = document.createElement("li");
        li.innerHTML = "<span class=sx>" + (s.icona ? "<img class=ic src='mappa/" + s.icona + "'>" : "")
          + "<span>" + nomeSpecie(n, s.cost) + "</span></span><span class=muto>" + s.dove.length + " " + t("luoghi") + "</span>";
        li.onclick = function () { mostraSpecie(n); };
        ul.appendChild(li);
      });
      if (nomi.length === 1) mostraSpecie(nomi[0]);
    } else {
      if (!q) return;
      var idx = costruisciIndiceAllenatori().filter(function (v) {
        return nomeAllenatore(v.p).toLowerCase().indexOf(q) >= 0 || v.p.nome.toLowerCase().indexOf(q) >= 0;
      });
      idx.slice(0, 80).forEach(function (v) {
        var li = document.createElement("li");
        var ge = dati.oe[v.p.gfx];
        li.innerHTML = "<span class=sx>" + (ge && ge.img.giu ? "<img class=oe src='mappa/" + ge.img.giu + "' style='width:16px;height:22px'>" : "")
          + "<span>" + nomeAllenatore(v.p) + "</span></span><span class=muto>" + nomeMappaK(v.key) + "</span>";
        li.onclick = function () { mostraPersonaggio(v.p, v.key); vaiA(v.key, v.p.x, v.p.y); };
        ul.appendChild(li);
      });
      if (!idx.length) ul.innerHTML = "<li><span class=muto>" + t("niente") + "</span></li>";
    }
  }

  function vaiA(key, tx, ty) {
    if (!origine(key)) {
      var m = dati.mappe[key];
      cronologia.push({ vista: { tipo: vista.tipo, id: vista.id, key: vista.key }, cx: cx, cy: cy, z: z, sel: selezionata });
      impostaVista(m.mondo ? { tipo: "mondo", id: m.mondo } : { tipo: "mappa", key: key }, false);
    }
    selezionata = key;
    centraSu(key, tx, ty, Math.max(z, 2));
    aggiornaNav();
  }

  // ------------------------------------------------------------- dettagli
  function bottoneTorna(key) {
    return "<span class='torna-su' data-vai='" + key + "'>\u2039 " + nomeMappaK(key) + "</span>";
  }
  function collegaTorna() {
    Array.prototype.forEach.call($("dett").querySelectorAll("[data-vai]"), function (el) {
      el.onclick = function () { var k = el.getAttribute("data-vai"); selezionata = k; mostraMappa(k); centraSu(k, undefined, undefined, Math.max(z, 1)); aggiornaNav(); };
    });
  }

  // UN Pokemon animato, alla misura che si chiede. Prima la GIF di
  // Nero/Bianco 2 (animazione vera), poi i due fotogrammi della decomp, poi
  // l'icona: cosi' la pagina non resta mai senza figura.
  function monAnimato(cost, lato) {
    var bw = dati.bw && dati.bw[cost];
    if (bw) return "<img class='monbw' src='mappa/" + bw + "' style='width:" + lato + "px;height:" + lato + "px'>";
    var f = dati.front && dati.front[cost];
    if (f) return "<div class='mon' style=\"background-image:url('mappa/" + f.img
      + "');width:" + lato + "px;height:" + lato + "px\"></div>";
    var ic = dati.icone && dati.icone[cost];
    return ic ? "<img class='ic' src='mappa/" + ic + "' style='width:" + lato + "px;height:" + lato + "px'>" : "";
  }

  function monBox(s) {
    var extra = "";
    if (s.tiene)
      extra += "<div class='lv'>" + t("tiene") + ": "
        + (dati.item && dati.item[s.tiene] ? "<img class=itm style='width:14px;height:14px;vertical-align:-2px' src='mappa/" + dati.item[s.tiene] + "'> " : "")
        + nomeItemC(s.tiene) + "</div>";
    if (s.mosse && s.mosse.length)
      extra += "<div class='lv' style='color:var(--tenue2);font-size:11px;line-height:1.35'>"
        + s.mosse.map(nomeMossa).join(" · ") + "</div>";
    return "<div class='mon-box'>" + monAnimato(s.cost, 64)
      + "<div class='nm'>" + nomeSpecie(s.specie, s.cost) + "</div>"
      + "<div class='lv'>" + t("lvl") + " " + s.lv + "</div>" + extra + "</div>";
  }

  // ---------------------------------------------------- la schedina al volo
  // Chiesta da Lain: cliccando un personaggio deve aprirsi UNA SCHEDINA LI'
  // ACCANTO che dice chi e' e che Pokemon ha - senza dover andare a cercare
  // nel fianco. Il fianco continua a riempirsi lo stesso (c'e' il resto:
  // doni, "vai qui", la mappa intera), ma non e' piu' l'unico posto.
  function chiudiScheda() { $("scheda").style.display = "none"; }

  function apriSchedaPersonaggio(pe, key, px, py) {
    var el = $("scheda"), ge = dati.oe[pe.gfx];
    var h = "<div class='testa'>";
    if (ge && ge.img.giu)
      h += "<img class=oe src='mappa/" + ge.img.giu + "' style='width:" + Math.min(34, ge.w * 1.6)
        + "px;height:" + Math.min(46, ge.h * 1.6) + "px'>";
    h += "<div>";
    if (pe.tipo === "allenatore" && pe.cc)
      h += "<div class=cl>" + G("classi", pe.cc, pe.nome.split(" ")[0]) + "</div>"
        + "<div class=nm>" + (G("trainers", pe.tc, pe.nome.split(" ").slice(1).join(" ")) || pe.nome) + "</div>";
    else
      h += "<div class=nm>" + nomePersonaggio(pe) + "</div>";
    h += "<div class=cl>" + nomeMappaK(key) + " (" + pe.x + "," + pe.y + ")</div></div>";
    h += "<button class='x' data-chiudi='1'>\u00D7</button></div>";
    h += "<div class='corpo'>";
    if (pe.squadra && pe.squadra.length) {
      h += "<div class='mons'>";
      pe.squadra.forEach(function (m) {
        h += "<div class='m'>" + monAnimato(m.cost, 62)
          + "<div class='nm'>" + nomeSpecie(m.specie, m.cost) + "</div>"
          + "<div class='lv'>" + t("lvl") + " " + m.lv + "</div></div>";
      });
      h += "</div>";
      // Le rivincite anche qui, ma strette: la schedina e' piccola e sta
      // accanto al puntatore. Aprendola cambia altezza, e posiziona() l'ha
      // gia' misurata: si ri-posiziona all'ontoggle, piu' sotto.
      if (pe.rematch && pe.rematch.length) {
        h += "<details class='sez' data-rem='1' style='margin-top:6px'><summary>"
          + t("rivincite", pe.rematch.length) + "</summary>";
        pe.rematch.forEach(function (r, i) {
          h += "<div class=muto style='margin-top:4px'>" + t("rivincita", i + 1) + "</div>";
          h += "<div class='mons'>";
          r.squadra.forEach(function (m) {
            h += "<div class='m'>" + monAnimato(m.cost, 62)
              + "<div class='nm'>" + nomeSpecie(m.specie, m.cost) + "</div>"
              + "<div class='lv'>" + t("lvl") + " " + m.lv + "</div></div>";
          });
          h += "</div>";
        });
        h += "</details>";
      }
    } else if (pe.doni && pe.doni.length) {
      h += "<div class=muto>" + t("dono") + ":</div><div>" + doniConIcona(pe, 22) + "</div>";
    } else {
      h += "<div class=muto>" + t("nienteSquadra") + "</div>";
    }
    if (pe.tipo === "allenatore" && pe.soldi)
      h += "<div class=muto>" + t("premio") + ": <b>" + pe.soldi + " ¥</b>"
        + (pe.doppia ? " · " + t("doppia") : "") + "</div>";
    if (pe.tipo === "allenatore" && pe.doni && pe.doni.length)
      h += "<div class=muto>" + t("ricompensa") + ":</div><div>" + doniConIcona(pe, 22) + "</div>";
    h += "</div>";
    el.innerHTML = h;
    el.style.display = "block";
    posiziona(el, px, py);
    el.querySelector("[data-chiudi]").onclick = chiudiScheda;
    // Aprendo le rivincite la schedina cresce: se era stata messa in basso,
    // uscirebbe dal riquadro. Si rimisura appena cambia.
    var rem = el.querySelector("[data-rem]");
    if (rem) rem.ontoggle = function () { posiziona(el, px, py); };
  }

  // dentro il riquadro della tela, e mai sopra il puntatore
  function posiziona(el, px, py) {
    var r = $("tela-box").getBoundingClientRect();
    var x = px + 14, y = py + 14;
    if (x + el.offsetWidth > r.width - 8) x = px - el.offsetWidth - 14;
    if (y + el.offsetHeight > r.height - 8) y = Math.max(8, r.height - el.offsetHeight - 8);
    el.style.left = Math.max(8, x) + "px";
    el.style.top = Math.max(8, y) + "px";
  }

  // ------------------------------------------------ il pannello a destra
  // "Stessa cosa per il percorso e i Pokemon che ci sono li'": cliccando una
  // zona si apre a destra l'elenco di cosa ci vive, sempre animato, diviso per
  // come lo si incontra (erba, acqua, pesca, spaccaroccia).
  function chiudiPannello() { $("pannello-dx").classList.remove("aperto"); }

  function apriPannelloMappa(key) {
    var m = dati.mappe[key];
    if (!m) return;
    var el = $("pannello-dx");
    var metodi = Object.keys(m.selvatici || {});
    var h = "<div class='testa'><div><div class='nm'>" + nomeMappa(m) + "</div>"
      + "<div class='su'>" + m.w + "\u00D7" + m.h + " " + t("tile")
      + " \u00B7 " + m.strumenti.length + " " + t("strumenti").toLowerCase()
      + " \u00B7 " + m.personaggi.filter(function (p) { return p.tipo === "allenatore"; }).length
      + " " + t("allenatori").toLowerCase() + "</div></div>"
      + "<button class='x' data-chiudi='1'>\u00D7</button></div><div class='corpo'>";
    if (!metodi.length) {
      h += "<div class=muto>" + t("nienteSelvatici") + "</div>";
    } else {
      metodi.forEach(function (met) {
        var v = m.selvatici[met];
        h += "<h5>" + met + " \u00B7 " + t("tasso") + " " + v.tasso + "</h5>";
        v.specie.forEach(function (sp) {
          var spd = dati.specie[sp.specie];
          var cost = sp.cost || (spd && spd.cost);
          // LO STRUMENTO CHE TIENE ADDOSSO. Le percentuali non sono
          // inventate: SetWildMonHeldItem (src/pokemon.c) tira Random()%100
          // con le soglie 45 e 95, quindi 50% il comune e 5% il raro; se i due
          // slot hanno lo STESSO strumento c'e' un ramo apposta che lo da'
          // sempre (100%). Le calcola gen_mappa.py, qui si disegnano.
          var ten = "";
          if (sp.tenuti && sp.tenuti.length) {
            ten = "<div class=ten>";
            sp.tenuti.forEach(function (it) {
              var ic = iconaItem(it);
              ten += "<span class=t1 title='" + t("tieneT") + "'>"
                   + (ic ? "<img class=px src='" + ic.src + "' alt=''>" : "")
                   + nomeItem(it) + " <b>" + it.pct + "%</b></span>";
            });
            ten += "</div>";
          }
          h += "<div class='zmon' data-sp='" + sp.specie + "'>" + monAnimato(cost, 48)
            + "<div class=chi><div class=nm>" + nomeSpecie(sp.specie, cost) + "</div>"
            + "<div class=dt>" + t("lvl") + " " + sp.lv
            + (sp.solo6 ? " · " + t("solo6") : "") + "</div>" + ten + "</div>"
            + "<span class=pc>" + sp.pct + "%</span></div>";
        });
      });
    }
    h += "</div>";
    el.innerHTML = h;
    el.classList.add("aperto");
    el.querySelector("[data-chiudi]").onclick = chiudiPannello;
    Array.prototype.forEach.call(el.querySelectorAll(".zmon"), function (d) {
      d.onclick = function () { mostraSpecie(d.getAttribute("data-sp")); };
    });
  }

  // Dopo un clic sulla mappa la scheda deve VEDERSI: senza questo restava
  // sotto la piega del fianco e sembrava che il clic non avesse fatto niente.
  function mostraDettagli() {
    var sez = $("dett-sez"), sc = $("scroll");
    if (!sez || !sc) return;
    var y = sez.offsetTop - sc.offsetTop - 6;
    if (sc.scrollTo) sc.scrollTo({ top: y, behavior: "smooth" });
    else sc.scrollTop = y;
  }

  function mostraPersonaggio(pe, key) {
    var ge = dati.oe[pe.gfx];
    var h = bottoneTorna(key);
    h += "<div class='cartellino'>";
    if (ge && ge.img.giu)
      h += "<img class=oe src='mappa/" + ge.img.giu + "' style='width:" + (ge.w * 2) + "px;height:" + (ge.h * 2) + "px'>";
    h += "<div class=chi>";
    if (pe.tipo === "allenatore" && pe.cc)
      h += "<div class=cl>" + G("classi", pe.cc, pe.nome.split(" ")[0]) + "</div>"
        + "<div class=nm>" + (G("trainers", pe.tc, pe.nome.split(" ").slice(1).join(" ")) || pe.nome) + "</div>";
    else
      h += "<div class=nm>" + nomePersonaggio(pe) + "</div>";
    h += "<div class=muto>" + nomeMappaK(key) + " (" + pe.x + "," + pe.y + ")</div>";
    h += "</div></div>";
    if (pe.squadra && pe.squadra.length) {
      h += "<h4>" + t("squadra") + " (" + pe.squadra.length + ")"
        + (pe.doppia ? " · " + t("doppia") : "") + "</h4><div class='squadra'>";
      pe.squadra.forEach(function (s) { h += monBox(s); });
      h += "</div>";
      // LE RIVINCITE, chiuse di base (gRematchTable, src/battle_setup.c).
      // Sono le squadre che l'allenatore tira fuori quando ti richiama col
      // PokeNav: piu' forti, e diverse dalla prima. Vanno sotto la squadra
      // base e non al posto suo, perche' quella e' l'unica che incontri
      // camminando; <details> senza `open` = tendina chiusa, e il CSS
      // `details.sez` c'e' gia' (lo usa la legenda).
      if (pe.rematch && pe.rematch.length) {
        h += "<details class='sez' style='margin-top:10px'><summary>"
          + t("rivincite", pe.rematch.length) + "</summary>";
        h += "<div class=muto style='margin:6px 0 2px'>" + t("rivinciteNota") + "</div>";
        pe.rematch.forEach(function (r, i) {
          h += "<h4>" + t("rivincita", i + 1)
            + (r.soldi ? " · " + r.soldi + " ¥" : "") + "</h4><div class='squadra'>";
          r.squadra.forEach(function (s) { h += monBox(s); });
          h += "</div>";
        });
        h += "</details>";
      }
    }
    // IL PREMIO IN DENARO: 4 x livello dell'ultimo della squadra x
    // moltiplicatore della classe (gTrainerMoneyTable), x2 in doppia -
    // calcolato da gen_mappa.py con la formula di GetTrainerMoneyToGive.
    if (pe.tipo === "allenatore" && pe.soldi)
      h += "<h4>" + t("premio") + "</h4><div><b>" + pe.soldi + " ¥</b></div>";
    if (pe.doni && pe.doni.length)
      h += "<h4>" + (pe.tipo === "allenatore" ? t("ricompensa") : t("dono")) + "</h4><div>"
        + doniConIcona(pe, 24) + "</div>";
    if (pe.c && dati.item[pe.c])
      h += "<h4>" + t("strumenti") + "</h4><img class=itm src='mappa/" + dati.item[pe.c] + "'> " + G("items", pe.c, pe.nome);
    h += "<div style='margin-top:10px'><span class='torna-su' data-vai2='1'>" + t("vaiQui") + "</span></div>";
    $("dett").innerHTML = h;
    collegaTorna();
    var b = $("dett").querySelector("[data-vai2]");
    if (b) b.onclick = function () { vaiA(key, pe.x, pe.y); };
    mostraDettagli();
  }

  function mostraStrumento(it, key) {
    var h = bottoneTorna(key);
    h += "<div class='cartellino'>";
    if (it.c && dati.item[it.c]) h += "<img class=itm style='width:36px;height:36px' src='mappa/" + dati.item[it.c] + "'>";
    h += "<div class=chi><div class=nm>" + nomeItem(it) + "</div><div class=cl>"
      + (it.nascosto ? t("nascosto") : it.dono ? t("dono") : t("aTerra")) + "</div>"
      + "<div class=muto>" + nomeMappaK(key) + " (" + it.x + "," + it.y + ")</div>"
      + (it.punti ? "<div class=muto>" + t("piuPunti", it.punti) + "</div>" : "")
      + "</div></div>";
    h += "<div style='margin-top:10px'><span class='torna-su' data-vai2='1'>" + t("vaiQui") + "</span></div>";
    $("dett").innerHTML = h;
    collegaTorna();
    var b = $("dett").querySelector("[data-vai2]");
    if (b) b.onclick = function () { vaiA(key, it.x, it.y); };
    mostraDettagli();
  }

  function mostraSpecie(nome) {
    var s = dati.specie[nome];
    evidenziate = {};
    var h = "<h3>" + monAnimato(s.cost, 64) + nomeSpecie(nome, s.cost) + "</h3>";
    h += "<table><tr><th>" + t("dove") + "</th><th>" + t("come") + "</th><th>%</th><th>" + t("lv") + "</th></tr>";
    s.dove.forEach(function (d) {
      evidenziate[d.mappa] = true;
      h += "<tr data-k='" + d.mappa + "'><td>" + nomeMappaK(d.mappa) + "</td><td>" + d.metodo + "</td><td class=n>" + d.pct + "%</td><td class=n>" + d.lv + "</td></tr>";
    });
    h += "</table><div class=muto style='margin-top:7px'>" + t("evidenziate") + "</div>";
    $("dett").innerHTML = h;
    Array.prototype.forEach.call($("dett").querySelectorAll("tr[data-k]"), function (tr) {
      tr.onclick = function () { var k = tr.getAttribute("data-k"); selezionata = k; centraSu(k, undefined, undefined, Math.max(z, 1)); mostraMappa(k); aggiornaNav(); };
    });
    mostraDettagli();
    dirty = true;
  }

  // ---------------------------------------------------------------- Safari

    h += H5("I due numeri nascosti", "The two hidden numbers");
    h += P("",

    h += P("muto",

      "From the fifth use it <b>always</b> flees. The \u201ccan't get closer\u201d message shows at the fourth, but the effect keeps applying." + R("battle_util.c:75, 590-615"));
